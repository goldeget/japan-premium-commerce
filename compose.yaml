name: kuranea

services:
  mariadb:
    image: mariadb:10.11@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-prestashop}
      MARIADB_USER: ${MARIADB_USER:-prestashop}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - mariadb_data:/var/lib/mysql

  prestashop:
    image: kuranea/prestashop:9.2.0
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${SHOP_BIND_ADDRESS:-127.0.0.1}:${SHOP_PORT:-8080}:80"
    environment:
      DB_SERVER: mariadb
      DB_PORT: "3306"
      DB_NAME: ${MARIADB_DATABASE:-prestashop}
      DB_USER: ${MARIADB_USER:-prestashop}
      DB_PASSWD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
      PS_INSTALL_AUTO: "1"
      PS_LANGUAGE: ja
      PS_COUNTRY: JP
      PS_DOMAIN: ${PS_DOMAIN:-localhost:${SHOP_PORT:-8080}}
      PS_ERASE_DB: "0"
      # The installer defaults its bundle-assets target to admin-dev when the
      # source /admin folder is renamed before installation. Keep real admin
      # files there until the official installer has completed its assets.
      PS_FOLDER_ADMIN: admin-dev
      KURANEA_ADMIN_FOLDER: admin-kuranea
      KURANEA_CATALOG_QUEUE_DIR: /var/lib/kuranea/catalog-review
      KURANEA_CATALOG_TEST_DEMO_APPROVAL: ${KURANEA_CATALOG_TEST_DEMO_APPROVAL:-0}
      # Checkout stays disabled in the base project. The isolated browser-order
      # workflow adds a run-scoped Compose override only for that QA step.
      CI: ${CI:-false}
      GITHUB_ACTIONS: ${GITHUB_ACTIONS:-false}
      GITHUB_RUN_ID: ${GITHUB_RUN_ID:-}
      GITHUB_RUN_ATTEMPT: ${GITHUB_RUN_ATTEMPT:-}
      KURANEA_ISOLATED_CI: "0"
      KURANEA_CI_PROJECT_NAME: ${CI_COMPOSE_PROJECT_NAME:-}
      KURANEA_ADMIN_LOCALE_DIAGNOSTICS: ${KURANEA_ADMIN_LOCALE_DIAGNOSTICS:-0}
      ADMIN_MAIL: ${ADMIN_MAIL:?Set ADMIN_MAIL in .env}
      ADMIN_PASSWD: ${ADMIN_PASSWD:?Set ADMIN_PASSWD in .env}
    volumes:
      - prestashop_html:/var/www/html
      - catalog_review_data:/var/lib/kuranea/catalog-review
      - type: bind
        source: ${HOST_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
        target: /etc/ssl/certs/ca-certificates.crt
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --show-error --fail --output /dev/null --header 'Host: ${PS_DOMAIN:-localhost:${SHOP_PORT:-8080}}' http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 2m

volumes:
  mariadb_data:
  prestashop_html:
  catalog_review_data:
