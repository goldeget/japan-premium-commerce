services:
  Kuranea\Backoffice\AdminLocaleSubscriber:
    autowire: true
    arguments:
      $translator: '@translator'
      $translatorLanguageLoader: '@prestashop.translation.translator_language_loader'
      $modulePath: '%prestashop.module_dir%kuraneabackoffice'
      $activeModules: '%prestashop.active_modules%'
    tags:
      - { name: kernel.event_subscriber }

  Kuranea\Backoffice\Admin\AdminPostTokenValidator:
    public: true
    arguments:
      $tokens: '@Symfony\Component\Security\Csrf\CsrfTokenManagerInterface'
      $security: '@security.helper'

  Kuranea\Backoffice\Admin\AdminResponseSubscriber:
    arguments:
      $tokens: '@Kuranea\Backoffice\Admin\AdminPostTokenValidator'
      $activeModules: '%prestashop.active_modules%'
    tags:
      - { name: kernel.event_subscriber }
