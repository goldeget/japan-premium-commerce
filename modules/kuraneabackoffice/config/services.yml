services:
  Kuranea\Backoffice\Form\CopyLanguageLabelsExtension:
    arguments:
      $requestStack: '@request_stack'
      $activeModules: '%prestashop.active_modules%'
    tags:
      - { name: form.type_extension }

  Kuranea\Backoffice\Cache\TwigWarmupTemplates:
    decorates: twig.template_iterator
    arguments:
      $templates: '@Kuranea\Backoffice\Cache\TwigWarmupTemplates.inner'

  Kuranea\Backoffice\AdminLocaleSubscriber:
    autowire: true
    arguments:
      $translator: '@translator'
      $translatorLanguageLoader: '@prestashop.translation.translator_language_loader'
      $modulePath: '%prestashop.module_dir%kuraneabackoffice'
      $activeModules: '%prestashop.active_modules%'
    tags:
      - { name: kernel.event_subscriber }

  Kuranea\Backoffice\Admin\AdminPostTokenValidator:
    public: true
    arguments:
      $tokens: '@Symfony\Component\Security\Csrf\CsrfTokenManagerInterface'
      $security: '@security.helper'

  Kuranea\Backoffice\Admin\AdminResponseSubscriber:
    arguments:
      $tokens: '@Kuranea\Backoffice\Admin\AdminPostTokenValidator'
      $activeModules: '%prestashop.active_modules%'
    tags:
      - { name: kernel.event_subscriber }

  Kuranea\Backoffice\AdminFacebookTransportExceptionSubscriber:
    autowire: true
    arguments:
      $security: '@security.helper'
      $twig: '@twig'
      $modulesPath: '%prestashop.module_dir%'
      $activeModules: '%prestashop.active_modules%'
    tags:
      - { name: kernel.event_subscriber }
