services:
  prestashop:
    environment:
      CI: "true"
      GITHUB_ACTIONS: "true"
      GITHUB_RUN_ID: ${GITHUB_RUN_ID:?GitHub Actions run ID is required for isolated checkout QA}
      GITHUB_RUN_ATTEMPT: ${GITHUB_RUN_ATTEMPT:?GitHub Actions run attempt is required for isolated checkout QA}
      KURANEA_ISOLATED_CI: "1"
      KURANEA_CI_PROJECT_NAME: ${CI_COMPOSE_PROJECT_NAME:?unique Compose project name is required for isolated checkout QA}
      KURANEA_CI_ORDER_ID: ${KURANEA_CI_ORDER_ID:-}
