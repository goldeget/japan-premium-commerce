name: ORDENOWA business profile module

on:
  push:
    branches: [work]
    paths:
      - '.github/workflows/business-profile.yml'
      - 'modules/kuraneabusinessprofile/**'
      - 'tests/business_profile/**'
  pull_request:
    paths:
      - '.github/workflows/business-profile.yml'
      - 'modules/kuraneabusinessprofile/**'
      - 'tests/business_profile/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out work
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd
          coverage: none

      - name: Lint business profile PHP files
        shell: bash
        run: |
          set -euo pipefail
          find tests/business_profile -name '*.php' -print0 > "$RUNNER_TEMP/business-profile-files"
          if [ -d modules/kuraneabusinessprofile ]; then
            find modules/kuraneabusinessprofile -name '*.php' -print0 >> "$RUNNER_TEMP/business-profile-files"
          fi
          xargs -0 -n1 php -l < "$RUNNER_TEMP/business-profile-files"

      - name: Run profile lifecycle tests
        run: php tests/business_profile/run.php

      - name: Run Korean admin settings tests
        run: php tests/business_profile/admin_settings.php

      - name: Verify official brand source upload and derivatives
        run: php tests/business_profile/brand_assets.php

      - name: Verify published customer output and PWA manifest
        run: php tests/business_profile/published_output.php

      - name: Verify localized legal page and seller disclosure gating
        shell: bash
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/legal-page-test-output"
          set +e
          php tests/business_profile/legal_pages.php 2>&1 | tee "$output_file"
          test_status=${PIPESTATUS[0]}
          set -e
          {
            echo '## Legal page synthetic test output'
            echo
            echo '```text'
            tail -n 50 "$output_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - name: Check legal page published-profile route contract
        run: python3 -m unittest discover -s tests/business_profile -p 'test_published_legal_page_contract.py'

      - name: Verify public brand and seller disclosure gating
        run: php tests/business_profile/public_footer.php

      - name: Verify order confirmation email profile integration
        run: php tests/business_profile/order_confirmation_mail.php

      - name: Check order confirmation email hook contract
        run: python3 -m unittest discover -s tests/business_profile -p 'test_order_confirmation_mail_contract.py'

      - name: Verify PrestaShop module bundle wiring
        run: php tests/business_profile/module_bundle.php
