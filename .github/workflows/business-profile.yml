name: ORDENOWA business profile module

on:
  push:
    branches: [work]
    paths:
      - '.github/workflows/business-profile.yml'
      - 'modules/kuraneabusinessprofile/**'
      - 'modules/kuraneabackoffice/**'
      - 'tests/business_profile/**'
      - 'tests/admin_support_assignments/**'
      - 'tests/e2e/verify_ci_customer_support_browser.py'
      - 'tests/e2e/test_ci_customer_support_browser_contract.py'
      - 'tests/admin_audit/**'
      - 'tests/backoffice_locale/**'
  pull_request:
    paths:
      - '.github/workflows/business-profile.yml'
      - 'modules/kuraneabusinessprofile/**'
      - 'modules/kuraneabackoffice/**'
      - 'tests/business_profile/**'
      - 'tests/admin_support_assignments/**'
      - 'tests/e2e/verify_ci_customer_support_browser.py'
      - 'tests/e2e/test_ci_customer_support_browser_contract.py'
      - 'tests/admin_audit/**'
      - 'tests/backoffice_locale/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out work
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, fileinfo
          coverage: none

      - name: Verify Korean locale targets the document root
        run: php tests/backoffice_locale/document_root_language.php

      - name: Lint business profile PHP files
        shell: bash
        run: |
          set -euo pipefail
          find tests/business_profile -name '*.php' -print0 > "$RUNNER_TEMP/business-profile-files"
          if [ -d modules/kuraneabusinessprofile ]; then
            find modules/kuraneabusinessprofile -name '*.php' -print0 >> "$RUNNER_TEMP/business-profile-files"
          fi
          if [ -d modules/kuraneabackoffice ]; then
            find modules/kuraneabackoffice -name '*.php' -print0 >> "$RUNNER_TEMP/business-profile-files"
          fi
          xargs -0 -n1 php -l < "$RUNNER_TEMP/business-profile-files"

      - name: Run profile lifecycle tests
        run: php tests/business_profile/run.php

      - name: Run Korean admin settings tests
        run: php tests/business_profile/admin_settings.php

      - name: Verify durable support assignment repository behavior
        run: php tests/admin_support_assignments/assignment_repository.php

      - name: Verify durable support assignment access contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests/admin_support_assignments -p 'test_*.py' -v

      - name: Verify employee profile audit hook and bounded read behavior
        run: php tests/admin_audit/employee_profile_audit.php

      - name: Verify employee profile audit source contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests/admin_audit -p 'test_*.py' -v

      - name: Verify official brand source upload and derivatives
        run: php tests/business_profile/brand_assets.php

      - name: Verify missing brand derivatives block publication
        run: php tests/business_profile/brand_publish_assets.php

      - name: Check uploaded brand asset display contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests/business_profile -p 'test_brand_asset_display_contract.py' -v

      - name: Check Korean shipping admin links contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests/business_profile -p 'test_shipping_admin_links_contract.py' -v

      - name: Check publish blocks unsaved profile changes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests/business_profile -p 'test_brand_publish_guard_contract.py' -v

      - name: Verify configured sitemap URL, robots preservation and XML limits
        run: php tests/business_profile/sitemap_policy.php

      - name: Check sitemap routing, shop isolation and commerce gate contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests/business_profile -p 'test_sitemap_source_contract.py' -v

      - name: Verify published customer output and PWA manifest
        run: php tests/business_profile/published_output.php

      - name: Verify localized legal page and seller disclosure gating
        id: legal_page_test
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/legal-page-test-output"
          set +e
          php tests/business_profile/legal_pages.php 2>&1 | tee "$output_file"
          test_status=${PIPESTATUS[0]}
          set -e
          {
            echo '## Legal page synthetic test output'
            echo
            echo '```text'
            tail -n 50 "$output_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          failure_line="$(grep -E 'PHP Fatal error|PHP Parse error|Uncaught (RuntimeException|Throwable|Error|Exception)|AssertionError|Failed asserting|Expected .* but got' "$output_file" | tail -n 1 | cut -c1-220 || true)"
          if [[ -z "$failure_line" ]]; then
            failure_line="$(tail -n 8 "$output_file" | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g' | cut -c1-220)"
          fi
          failure_line="${failure_line//%/%25}"
          failure_line="${failure_line//$'\r'/%0D}"
          failure_line="${failure_line//$'\n'/%0A}"
          printf 'failure=%s\n' "$failure_line" >> "$GITHUB_OUTPUT"
          exit "$test_status"

      - name: "Expose legal page failure: ${{ steps.legal_page_test.outputs.failure }}"
        if: steps.legal_page_test.outcome == 'failure'
        run: exit 1

      - name: Check legal page published-profile route contract
        run: python3 -m unittest discover -s tests/business_profile -p 'test_published_legal_page_contract.py'

      - name: Check admin access denial and render contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests/business_profile -p 'test_admin_access_source_contract.py'

      - name: Check profile history field-level change contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests/business_profile -p 'test_admin_profile_history_contract.py'

      - name: Verify public brand and seller disclosure gating
        run: php tests/business_profile/public_footer.php

      - name: Verify order confirmation email profile integration
        run: php tests/business_profile/order_confirmation_mail.php

      - name: Check order confirmation email hook contract
        run: python3 -m unittest discover -s tests/business_profile -p 'test_order_confirmation_mail_contract.py'

      - name: Verify PrestaShop module bundle wiring
        run: php tests/business_profile/module_bundle.php
