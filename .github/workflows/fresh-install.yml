      - name: Verify Chromium PWA lifecycle and private-route cache protection
        id: pwa_browser_qa
        if: always() && !cancelled() && steps.compose_up.outcome == 'success' && steps.chromium_setup.outcome == 'success' && env.ORDENOWA_ADMIN_SECURITY_FOCUS != 'true'
        continue-on-error: true
