            exit 1
          fi
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_ci_native_order_lifecycle.php' \
            < tests/postcode/verify_ci_native_order_lifecycle.php
          verification_stdout="$RUNNER_TEMP/order-lifecycle-verification.stdout"
          if ! docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e KURANEA_CI_RETURN_BROWSER_OUTCOME="$KURANEA_CI_RETURN_BROWSER_OUTCOME" \
            -e KURANEA_CI_ADMIN_RETURN_BROWSER_OUTCOME="$KURANEA_CI_ADMIN_RETURN_BROWSER_OUTCOME" \
            -e KURANEA_CI_UNPAID_ORDER_ID="$UNPAID_ORDER_ID" \
            -e KURANEA_CI_PAID_LIKE_ORDER_ID="$PAID_LIKE_ORDER_ID" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/verify_ci_native_order_lifecycle.php \
            > "$verification_stdout" 2> "$RUNNER_TEMP/order-lifecycle-verification.stderr"; then
            cat "$RUNNER_TEMP/order-lifecycle-verification.stderr" >&2
            exit 1
          fi
          verification_payload=$(sed -n '1p' "$verification_stdout")
          if ! python3 -c 'import json,sys; d=json.loads(sys.argv[1]); keys=("status","unpaid_cancellation","return_request","credit_slip","cash_refund","return_config_restored"); print(json.dumps({k:d[k] for k in keys if k in d},sort_keys=True))' \
            "$verification_payload" > "$QA_ARTIFACT_DIR/order-lifecycle-verification.json"; then
            echo '::error title=ORDENOWA native order lifecycle::The verifier result could not be safely summarized.'
            exit 1
          fi
          if ! python3 -c 'import json,sys; d=json.loads(sys.argv[1]); expected={"status":"passed","unpaid_cancellation":"passed","return_request":"passed","credit_slip":"passed","cash_refund":"not_requested","return_config_restored":True}; assert all(d.get(k)==v for k,v in expected.items()), "native order lifecycle did not reach every required success state"' \
            "$verification_payload"; then
            echo '::error title=ORDENOWA native order lifecycle::Native lifecycle results were incomplete; sanitized result follows.'
            cat "$QA_ARTIFACT_DIR/order-lifecycle-verification.json"
            exit 1
          fi
          cat "$verification_stdout" | tail -n +2 >> "$QA_ARTIFACT_DIR/order-lifecycle-e2e.log"
          cat "$QA_ARTIFACT_DIR/order-lifecycle-e2e.log"
          rm -f -- "$verification_stdout" "$RUNNER_TEMP/order-lifecycle-verification.stderr"

      - name: Verify order-bound bank transfer issue, rejection, and receipt confirmation in Chromium
