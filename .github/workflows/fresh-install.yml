name: Isolated fresh install

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - '.github/workflows/fresh-install.yml'
      - 'compose.yaml'
      - 'docker/**'
      - 'themes/**'
      - 'modules/kuraneapostcode/**'
      - 'modules/kuraneabackoffice/**'
      - 'tests/smoke/fresh_install.sh'
      - 'tests/smoke/collect_failure_diagnostics.sh'
      - 'tests/smoke/test_admin_folder_install_order.py'
      - 'tests/smoke/test_docker_run_recovery.py'
      - 'tests/smoke/test_ci_diagnostics_script.py'
      - 'tests/postcode/**'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI_COMPOSE_PROJECT_NAME: kuranea-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SHOP_PORT: 18080
    steps:
      - name: Check out work and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare disposable test credentials
        shell: bash
        run: |
          cat > .env <<'EOF'
          MARIADB_DATABASE=prestashop
          MARIADB_USER=prestashop
          MARIADB_PASSWORD=ci-only-db-password
          MARIADB_ROOT_PASSWORD=ci-only-root-password
          ADMIN_MAIL=ci-kuranea@example.invalid
          ADMIN_PASSWD=Ci-Only-Admin-Password-92!
          EOF

      - name: Validate Compose configuration
        run: docker compose -p "$CI_COMPOSE_PROJECT_NAME" config --quiet

      - name: Verify Japan Post refresh command contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/postcode -p 'test_*.py' -v

      - name: Verify PrestaShop admin install order contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.smoke.test_admin_folder_install_order -v

      - name: Verify Docker startup cleanup regression contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.smoke.test_docker_run_recovery -v

      - name: Verify fresh-install workflow contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.smoke.test_fresh_install_workflow_contract -v

      - name: Build the PrestaShop image
        id: image_build
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" build --progress=plain prestashop

      - name: Verify fresh cache ownership in an isolated probe project
        id: cache_probe
        shell: bash
        run: |
          set -euo pipefail
          probe_project="${CI_COMPOSE_PROJECT_NAME}-cache-probe"
          cleanup_probe() {
            docker compose -p "$probe_project" down -v --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup_probe EXIT
          docker compose -p "$probe_project" run --rm --no-deps --entrypoint /bin/sh prestashop -ec '
            cache_dir=/var/www/html/var/cache/prod
            mkdir -p "$cache_dir"
            printf stale > "$cache_dir/class_index.php"
            chown -R root:root "$cache_dir"
            /tmp/pre-install-scripts/10-kuranea-cache-ownership.sh
            test "$(stat -c "%U:%G" "$cache_dir/class_index.php")" = www-data:www-data
            runuser -g www-data -u www-data -- test -w "$cache_dir/class_index.php"
          '
          cleanup_probe
          trap - EXIT

      - name: Start the empty-volume shop
        id: compose_up
        shell: bash
        run: docker compose -p "$CI_COMPOSE_PROJECT_NAME" up -d --wait --wait-timeout 900

      - name: Download and import official Japan Post KEN_ALL data
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ken_all.zip"
          csv="$RUNNER_TEMP/KEN_ALL.CSV"
          curl --fail --location --retry 3 --retry-delay 2 --max-time 180 \
            'https://www.post.japanpost.jp/service/search/zipcode/download/kogaki/zip/ken_all.zip' \
            --output "$archive"
          unzip -p "$archive" KEN_ALL.CSV > "$csv"
          test -s "$csv"
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop sh -c 'cat > /tmp/KEN_ALL.CSV' < "$csv"
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            php /var/www/html/modules/kuraneapostcode/bin/import-ken-all.php --file=/tmp/KEN_ALL.CSV

      - name: Verify real Tokyo postcode lookup
        env:
          SHOP_BASE_URL: http://127.0.0.1:18080
        run: |
          set -euo pipefail
          payload=$(curl --fail --silent --show-error --location --get "$SHOP_BASE_URL/" \
            --data-urlencode 'fc=module' \
            --data-urlencode 'module=kuraneapostcode' \
            --data-urlencode 'controller=candidates' \
            --data-urlencode 'q=1000004')
          python3 - "$payload" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          assert data.get("manual_entry_available") is True
          assert any(
              item.get("postcode") == "100-0004"
              and item.get("prefecture") == "東京都"
              and item.get("municipality") == "千代田区"
              and item.get("town") == "大手町"
              for item in data.get("candidates", [])
          ), data
          print("PASS: official Japan Post postcode 1000004 resolves to Tokyo / Chiyoda / Otemachi")
          PY

      - name: Verify saved native Tokyo address
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_native_address_persistence.php' \
            < tests/postcode/verify_native_address_persistence.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            prestashop \
            runuser -g www-data -u www-data -- php /tmp/verify_native_address_persistence.php

      - name: Verify Japan Post address in an unpaid native order and Back Office view
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_native_order_persistence.php' \
            < tests/postcode/verify_native_order_persistence.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI="$CI" \
            -e GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e KURANEA_CI_RUN_ID="$GITHUB_RUN_ID" \
            -e KURANEA_CI_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/verify_native_order_persistence.php

      - name: Verify the fresh shop and restart persistence
        env:
          SHOP_BASE_URL: http://127.0.0.1:18080
        run: bash tests/smoke/fresh_install.sh "$CI_COMPOSE_PROJECT_NAME"

      - name: Capture bounded diagnostics on failure
        if: failure()
        shell: bash
        run: |
          {
            printf 'Build outcome: %s\n' '${{ steps.image_build.outcome }}'
            printf 'Cache probe outcome: %s\n' '${{ steps.cache_probe.outcome }}'
            printf 'Compose startup outcome: %s\n' '${{ steps.compose_up.outcome }}'
          } | tee "$RUNNER_TEMP/kuranea-bootstrap-stage.txt" >> "$GITHUB_STEP_SUMMARY"
          bash tests/smoke/collect_failure_diagnostics.sh

      - name: Upload redacted install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuranea-compose-startup-diagnostics-redacted.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Remove only this run's containers and volumes
        if: always()
        run: docker compose -p "$CI_COMPOSE_PROJECT_NAME" down -v --remove-orphans
