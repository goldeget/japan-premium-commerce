            2>&1 | tee "$QA_ARTIFACT_DIR/backup-restore-drill.log"

      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordenowa-storefront-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ordenowa-browser-qa/
          if-no-files-found: error
          retention-days: 30

      - name: Verify focused admin security route screenshot
        if: always() && env.ORDENOWA_ADMIN_SECURITY_FOCUS == 'true' && env.ORDENOWA_ADMIN_RETURN_FOCUS != 'true'
        id: admin_dashboard_route_screenshot
        shell: bash
        run: |
          set -euo pipefail
          screenshot="$RUNNER_TEMP/ordenowa-browser-qa/admin-security-view-only-dashboard-route-state.png"
          if [[ ! -s "$screenshot" ]]; then
            echo '::error title=ORDENOWA dashboard route evidence::The focused dashboard route screenshot is missing or empty.'
            exit 1
          fi
          python3 - "$screenshot" <<'PYSCREEN'
          from pathlib import Path
          import struct, sys
          data = Path(sys.argv[1]).read_bytes()
          if len(data) < 24 or data[:8] != b'\x89PNG\r\n\x1a\n':
