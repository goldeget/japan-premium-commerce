      - name: Prepare isolated free-shipping order and coupon fixtures
        id: shipping_free_fixture
        if: always() && !cancelled() && steps.compose_up.outcome == 'success' && steps.chromium_setup.outcome == 'success' && steps.shipping_product_fixture.outcome == 'success' && (env.ORDENOWA_ADMIN_QA_FOCUS != 'true' || env.ORDENOWA_ADMIN_RETURN_FOCUS == 'true')
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/ordenowa-browser-qa"
          shipping_fixture_stage="japan_zone_prepare"
          shipping_fixture_log="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-fixture.log"
          report_shipping_fixture_failure() {
            local status=$?
            trap - ERR
            set +e
            local detail
            detail=$(tail -n 5 "$shipping_fixture_log" 2>/dev/null | tr '\r\n' ' ' | cut -c1-600)
            detail=${detail//%/%25}
            printf '::error title=ORDENOWA free-shipping fixture::phase=%s; exit=%s; %s\n' \
              "$shipping_fixture_stage" "$status" "$detail"
            exit "$status"
          }
          trap report_shipping_fixture_failure ERR
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/prepare_ci_japan_shipping_zone.php' \
            < tests/postcode/prepare_ci_japan_shipping_zone.php
          zone_fixture="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-japan-zone-fixture.json"
          shipping_fixture_stage="japan_zone_prepare"
          shipping_fixture_log="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-japan-zone-fixture.log"
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/prepare_ci_japan_shipping_zone.php \
            > "$zone_fixture" 2> "$shipping_fixture_log"
          cat "$shipping_fixture_log"
          shipping_fixture_stage="japan_zone_validate"
          shipping_fixture_log="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-zone-validation.log"
          python3 - "$zone_fixture" <<'PY' 2>&1 | tee "$shipping_fixture_log"
          import json, sys
          fixture = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_state_codes = [f"JP-{code:02d}" for code in range(1, 48)]
          assert int(fixture["zone_id"]) > 0
          assert fixture["country_codes"] == ["JP"]
          assert int(fixture["state_count"]) == 47
          assert int(fixture["active_state_count"]) == 47
          assert fixture["state_iso_codes"] == expected_state_codes
          assert fixture["fixture_scope"] == "run-scoped isolated GitHub Actions disposable checkout database"
          PY
          shipping_fixture_stage="active_product_readback"
          shipping_fixture_log="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-product-readback.log"
          product_record=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T mariadb \
            sh -ec "MYSQL_PWD=\"\$MARIADB_ROOT_PASSWORD\" mariadb --protocol=tcp -h127.0.0.1 -uroot -N \"\$MARIADB_DATABASE\" -e \"SELECT ps.id_product, ps.id_tax_rules_group FROM ps_product p JOIN ps_product_shop ps ON ps.id_product=p.id_product AND ps.id_shop=1 WHERE p.id_product=$CI_TEST_PRODUCT_ID AND p.reference LIKE \\\"KURANEA-CI-%\\\" AND p.active=1\"" \
            2>&1 | tee "$shipping_fixture_log")
          IFS=$'\t' read -r product_id product_tax_group_id <<< "$product_record"
          if ! [[ "$product_id" =~ ^[0-9]+$ ]] || [ "$product_id" -lt 1 ] \
            || [ "$product_tax_group_id" != "$CI_TEST_TAX_RULES_GROUP_ID" ]; then
            echo "::error title=ORDENOWA free-shipping fixture::phase=active_product_readback; product_id=$product_id; tax_group_id=$product_tax_group_id"
            exit 1
          fi
          shipping_fixture_stage="japan_zone_and_stock"
          shipping_fixture_log="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-zone-stock-readback.log"
          japan_zone_id=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T mariadb \
            sh -ec 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb --protocol=tcp -h127.0.0.1 -uroot -N "$MARIADB_DATABASE" -e "SELECT id_zone FROM ps_country WHERE iso_code=\"JP\" AND active=1 ORDER BY id_country LIMIT 1"' \
            2>&1 | tee "$shipping_fixture_log")
          stock_quantity=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T mariadb \
            sh -ec "MYSQL_PWD=\"\$MARIADB_ROOT_PASSWORD\" mariadb --protocol=tcp -h127.0.0.1 -uroot -N \"\$MARIADB_DATABASE\" -e \"SELECT COALESCE(SUM(quantity),0) FROM ps_stock_available WHERE id_product=$product_id AND id_product_attribute=0\"" \
            2>&1 | tee -a "$shipping_fixture_log")
          if ! [[ "$product_id" =~ ^[0-9]+$ ]] || [ "$product_id" -lt 1 ] \
            || ! [[ "$japan_zone_id" =~ ^[0-9]+$ ]] || [ "$japan_zone_id" -lt 1 ] \
            || ! [[ "$stock_quantity" =~ ^[0-9]+$ ]] || [ "$stock_quantity" -lt 2 ]; then
            echo "::error title=ORDENOWA free-shipping fixture::phase=japan_zone_and_stock; product_id=$product_id; japan_zone_id=$japan_zone_id; stock=$stock_quantity"
            exit 1
          fi
          {
            printf 'CI_TEST_PRODUCT_ID=%s\n' "$product_id"
            printf 'CI_TEST_PRODUCT_TAX_GROUP=%s\n' "$product_tax_group_id"
            printf 'CI_JAPAN_ZONE_ID=%s\n' "$japan_zone_id"
          } >> "$GITHUB_ENV"
          shipping_fixture_stage="coupon_prepare"
          shipping_fixture_log="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-coupon-prepare.log"
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/seed_ci_shipping_coupon.php' \
            < tests/postcode/seed_ci_shipping_coupon.php
          coupon_fixture="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-coupon-fixture.json"
          shipping_fixture_stage="coupon_seed"
          shipping_fixture_log="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-coupon-fixture.log"
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/seed_ci_shipping_coupon.php \
            > "$coupon_fixture" 2> "$shipping_fixture_log"
          cat "$shipping_fixture_log"
          shipping_fixture_stage="coupon_validate"
          shipping_fixture_log="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-coupon-validation.log"
          coupon_code=$(python3 - "$coupon_fixture" <<'PY' 2>&1 | tee "$shipping_fixture_log"
          import json, sys
          fixture = json.load(open(sys.argv[1], encoding="utf-8"))
          assert fixture["currency"] == "JPY"
          assert fixture["reduction_percent"] == 50.0
          assert fixture["free_shipping"] is False
          assert fixture["fixture_scope"] == "run-scoped GitHub Actions disposable checkout database"
          print(fixture["code"])
          PY
          )
          if [[ ! "$coupon_code" =~ ^ORDENOWACI[0-9]+$ ]]; then
            echo 'The isolated run-scoped shipping-test coupon code was not valid.' >&2
            exit 1
          fi
          printf 'CI_COUPON_CODE=%s\n' "$coupon_code" >> "$GITHUB_ENV"
          printf 'PASS: prepared run-scoped synthetic-tax product id=%s, Japan zone=%s, and a JPY coupon with no free-shipping override.\n' \
            "$product_id" "$japan_zone_id"

      - name: Grant isolated CI administrator the native AdminCarriers create permissions
        id: shipping_free_admin_access
        if: steps.shipping_free_fixture.outcome == 'success' && (env.ORDENOWA_ADMIN_QA_FOCUS != 'true' || env.ORDENOWA_ADMIN_RETURN_FOCUS == 'true')
        continue-on-error: true
        shell: bash
        env:
          ADMIN_MAIL: ci-ordenowa@example.invalid
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/ordenowa-browser-qa"
          fixture_json="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-admin-access.json"
          fixture_log="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-admin-access.log"
          copy_status=0
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/prepare_ci_carrier_admin_access.php' \
            < tests/postcode/prepare_ci_carrier_admin_access.php \
            2> "$fixture_log" || copy_status=$?
          if ((copy_status != 0)); then
            echo "::error title=ORDENOWA isolated carrier access fixture::stage=stage_fixture_copy; exit_code=$copy_status"
            exit "$copy_status"
          fi
          fixture_status=0
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e ADMIN_MAIL="$ADMIN_MAIL" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/prepare_ci_carrier_admin_access.php \
            > "$fixture_json" 2> "$fixture_log" || fixture_status=$?
          cat "$fixture_log"
          if ((fixture_status != 0)); then
            echo "::error title=ORDENOWA isolated carrier access fixture::Exited with code $fixture_status; see the stage diagnostic above."
            exit "$fixture_status"
          fi
          python3 - "$fixture_json" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as stream:
                  fixture = json.load(stream)
          except (OSError, ValueError) as error:
              print(f"::error title=ORDENOWA isolated carrier access fixture::Invalid JSON; error_type={type(error).__name__}")
              sys.exit(1)
          if not isinstance(fixture, dict):
              print("::error title=ORDENOWA isolated carrier access fixture::Invalid JSON root; expected=object")
              sys.exit(1)

          def is_positive_int(field):
              try:
                  return int(fixture[field]) > 0
              except (KeyError, TypeError, ValueError):
                  return False

          checks = {
              "admin_profile_id": is_positive_int("admin_profile_id"),
              "carrier_tab_id": is_positive_int("carrier_tab_id"),
              "read": fixture.get("read") is True,
              "create": fixture.get("create") is True,
              "update": fixture.get("update") is True,
              "delete_permission_changed": fixture.get("delete_permission_changed") is False,
              "fixture_scope": fixture.get("fixture_scope") == "run-scoped isolated GitHub Actions disposable checkout database",
          }
          failed_fields = [field for field, passed in checks.items() if not passed]
          if failed_fields:
              print("::error title=ORDENOWA isolated carrier access fixture::Invalid JSON fields: " + ",".join(failed_fields))
              sys.exit(1)
          print("PASS: isolated AdminCarriers permissions are validated with delete access unchanged.")
          PY

