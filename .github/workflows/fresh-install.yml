          fwrite(STDOUT, "PASS: isolated CI Osaka region JP-27 is active for the supported-region checkout.\n");
          PHP
          postcode_stage="synthetic_csv"
          postcode_stage_log="$RUNNER_TEMP/ordenowa-browser-qa/postcode-fixture-synthetic-csv.log"
          {
            printf '%s\n' \
              '"13101","","1000004","","","","東京都","千代田区","大手町","","","","","",""' \
              '"27127","","5300001","","","","大阪府","大阪市北区","梅田","","","","","",""'
          } \
            | docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
                sh -c 'cat > /tmp/ordenowa-ci-only-ken-all.csv' 2>&1 \
            | tee "$postcode_stage_log"
          postcode_stage="ken_all_import"
          postcode_stage_log="$RUNNER_TEMP/ordenowa-browser-qa/postcode-fixture-import.log"
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            runuser -g www-data -u www-data -- \
            php /var/www/html/modules/kuraneapostcode/bin/import-ken-all.php \
