              "order_lifecycle_fixture=$ORDER_LIFECYCLE_FIXTURE_OUTCOME" \
              "order_return_browser=$ORDER_RETURN_BROWSER_OUTCOME" \
              "order_return_admin_browser=$ORDER_RETURN_ADMIN_BROWSER_OUTCOME" \
              "admin_return_evidence=$BROWSER_QA_EVIDENCE_OUTCOME"; do
              if [[ "$entry" != *=success ]]; then
                failed_steps+=("$entry")
              fi
            done
            if ((${#failed_steps[@]})); then
              printf '::error title=ORDENOW focused admin return QA::Failed steps: %s\n' "${failed_steps[*]}"
              exit 1
            fi
            printf 'PASS: focused admin RMA browser check completed with original-state readback.\n'
            exit 0
          fi
          if [[ "$ORDENOWA_ADMIN_SECURITY_FOCUS" == true ]]; then
            failed_steps=()
            for entry in \
              "security_fixture=$SECURITY_FIXTURE_OUTCOME" \
              "admin_security_browser_qa=$ADMIN_SECURITY_BROWSER_QA_OUTCOME" \
              "admin_dashboard_route_screenshot=$ADMIN_DASHBOARD_ROUTE_SCREENSHOT_OUTCOME"; do
              if [[ "$entry" != *=success ]]; then
                failed_steps+=("$entry")
              fi
            done
            if [[ "$SECURITY_ADMIN_LOCALE_MUTATED" == 1 && "$SECURITY_LOCALE_RESTORE_OUTCOME" != success ]]; then
              failed_steps+=("security_locale_restore=$SECURITY_LOCALE_RESTORE_OUTCOME")
            fi
            if ((${#failed_steps[@]})); then
              printf '::error title=ORDENOW focused admin security QA::Failed steps: %s\n' "${failed_steps[*]}"
              exit 1
            fi
            printf 'PASS: focused admin security route QA completed with captured path and screenshot.\n'
            exit 0
          fi
          failed_steps=()
          for entry in \
            "shipping_product_fixture=$SHIPPING_PRODUCT_FIXTURE_OUTCOME" \
            "exemption_product_fixture=$EXEMPTION_PRODUCT_FIXTURE_OUTCOME" \
            "tax_fixture=$TAX_FIXTURE_OUTCOME" \
            "variant_fixture=$VARIANT_FIXTURE_OUTCOME" \
            "cart_controls_browser_qa=$CART_CONTROLS_BROWSER_QA_OUTCOME" \
            "storefront_search=$STOREFRONT_SEARCH_BROWSER_QA_OUTCOME" \
            "storefront_product_seo=$STOREFRONT_SEO_BROWSER_QA_OUTCOME" \
            "security_fixture=$SECURITY_FIXTURE_OUTCOME" \
            "admin_security_browser_qa=$ADMIN_SECURITY_BROWSER_QA_OUTCOME" \
            "reset_token_browser_qa=$RESET_TOKEN_BROWSER_QA_OUTCOME" \
            "pwa_browser_qa=$PWA_BROWSER_QA_OUTCOME" \
            "pwa_push_qa=$PWA_PUSH_QA_OUTCOME" \
            "shipping_free_fixture=$SHIPPING_FREE_FIXTURE_OUTCOME" \
            "shipping_free_admin_access=$SHIPPING_FREE_ADMIN_ACCESS_OUTCOME" \
            "shipping_free_admin_configure=$SHIPPING_FREE_ADMIN_CONFIGURE_OUTCOME" \
            "shipping_free_restart=$SHIPPING_FREE_RESTART_OUTCOME" \
            "shipping_free_admin_readback=$SHIPPING_FREE_ADMIN_READBACK_OUTCOME" \
            "shipping_free_customer_browser_qa=$SHIPPING_FREE_CUSTOMER_BROWSER_QA_OUTCOME" \
            "shipping_free_osaka_mobile_browser_qa=$SHIPPING_FREE_OSAKA_MOBILE_BROWSER_QA_OUTCOME" \
            "shipping_free_taxable_browser_qa=$SHIPPING_FREE_TAXABLE_BROWSER_QA_OUTCOME" \
            "shipping_free_exemption_browser_qa=$SHIPPING_FREE_EXEMPTION_BROWSER_QA_OUTCOME" \
            "shipping_free_order_persistence=$SHIPPING_FREE_ORDER_PERSISTENCE_OUTCOME" \
            "shipping_free_admin_browser_qa=$SHIPPING_FREE_ADMIN_BROWSER_QA_OUTCOME" \
            "postcode_fixture=$POSTCODE_FIXTURE_OUTCOME" \
            "postcode_lookup=$POSTCODE_LOOKUP_OUTCOME" \
            "native_address_persistence=$NATIVE_ADDRESS_PERSISTENCE_OUTCOME" \
            "native_order_persistence=$NATIVE_ORDER_PERSISTENCE_OUTCOME" \
            "brand=$BRAND_BROWSER_QA_OUTCOME" \
            "shipping_admin=$SHIPPING_ADMIN_BROWSER_QA_OUTCOME" \
            "reset_email_brand=$RESET_EMAIL_BRAND_BROWSER_QA_OUTCOME" \
            "reset_email_locale=$RESET_EMAIL_LOCALE_BROWSER_QA_OUTCOME" \
            "account=$ACCOUNT_BROWSER_QA_OUTCOME" \
            "account_checkout_override=$ACCOUNT_CHECKOUT_OVERRIDE_OUTCOME" \
            "account_checkout_restore=$ACCOUNT_CHECKOUT_RESTORE_OUTCOME" \
            "catalog_import_fixture=$CATALOG_IMPORT_FIXTURE_OUTCOME" \
            "catalog_import_admin_access_readback=$CATALOG_IMPORT_ADMIN_ACCESS_READBACK_OUTCOME" \
            "catalog_import_browser_qa=$CATALOG_IMPORT_BROWSER_QA_OUTCOME" \
            "catalog_import_restore=$CATALOG_IMPORT_RESTORE_OUTCOME" \
            "product_admin=$PRODUCT_ADMIN_BROWSER_QA_OUTCOME" \
            "storefront=$STOREFRONT_BROWSER_QA_OUTCOME" \
            "blockreassurance_runtime=$BLOCKREASSURANCE_RUNTIME_OUTCOME" \
