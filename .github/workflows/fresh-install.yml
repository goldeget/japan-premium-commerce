          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          expected_project="kuranea-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$CI_COMPOSE_PROJECT_NAME" == "$expected_project" ]]
          [[ "$CI" == true && "$GITHUB_ACTIONS" == true && "$KURANEA_ISOLATED_CI" == 1 ]]
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            bash -o pipefail -ec 'find /var/www/html/modules/kuraneapush -type f -name "*.php" -print0 | xargs -0 -n 1 php -l'
