      - name: Verify native persistence of synthetic order tracking
        id: shipping_free_tracking_persistence
        if: steps.shipping_free_admin_browser_qa.outcome == 'success' && env.ORDENOWA_ADMIN_QA_FOCUS != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ordenowa-browser-qa"
          browser_result="$artifact_dir/shipping-free-order-tracking-verified.json"
          projected_input="$RUNNER_TEMP/ordenowa-tracking-readback-input.json"
          persistence_result="$artifact_dir/shipping-free-order-tracking-persistence-verified.json"
          persistence_log="$artifact_dir/shipping-free-order-tracking-persistence.log"
          if [ ! -s "$browser_result" ]; then
            echo '::error title=ORDENOWA tracking persistence::The successful browser step did not produce its result JSON.'
            exit 1
          fi
          python3 - "$browser_result" "$projected_input" <<'PY'
          import json
          import re
          import sys

          source_path, output_path = sys.argv[1:]
          with open(source_path, encoding="utf-8") as stream:
              payload = json.load(stream)
          integer_keys = (
              "order_id", "carrier_id", "order_carrier_id", "admin_order_total",
              "admin_order_state_id_before", "admin_order_state_id_after",
          )
          bool_true_keys = (
              "synthetic_ci_only", "admin_origin_matches", "admin_folder_matches",
              "admin_order_id_matches", "admin_post_save_order_id_matches",
              "admin_fresh_get_order_id_matches", "admin_fresh_get_method_get", "customer_origin_matches",
              "customer_order_id_matches", "admin_and_customer_order_ids_match",
              "admin_and_customer_tracking_number_matches",
              "admin_fresh_document_readback", "customer_same_order_detail_readback",
              "admin_order_state_preserved", "free_shipping_preserved",
          )
          admin_classes = {"modern_order_detail", "legacy_order_detail"}
          customer_classes = {"order_detail_controller", "friendly_order_detail"}
          reference = payload.get("order_reference")
          tracking = payload.get("tracking_number")
          valid = (
              isinstance(payload, dict)
              and all(type(payload.get(key)) is int and payload[key] >= 0 for key in integer_keys)
              and all(payload.get(key) is True for key in bool_true_keys)
              and payload.get("order_id", 0) > 0
              and payload.get("carrier_id", 0) > 0
              and payload.get("order_carrier_id", 0) > 0
              and payload.get("admin_order_state_id_before") == payload.get("admin_order_state_id_after")
              and payload.get("admin_order_total", 0) > 0
              and payload.get("admin_shipping_total") == 0
              and payload.get("order_state_paid") is False
              and payload.get("total_paid_real") == 0
              and payload.get("shipping_total") == 0
              and payload.get("physical_dispatch_performed") is False
              and payload.get("carrier_scan_performed") is False
              and payload.get("admin_route_class_before_update") in admin_classes
              and payload.get("admin_route_class_after_save") in admin_classes
              and payload.get("admin_route_class_after_fresh_get") in admin_classes
              and payload.get("customer_detail_route_class") in customer_classes
              and isinstance(reference, str) and re.fullmatch(r"[A-Z0-9]{8,16}", reference)
              and isinstance(tracking, str)
              and re.fullmatch(r"ORDENOWA-CI-TRACK-[0-9]{1,20}-[0-9]{1,4}", tracking)
          )
          if not valid:
              raise SystemExit("The browser tracking result failed its allowlisted readback schema.")
          keys = (
              "synthetic_ci_only", "order_id", "order_reference", "carrier_id", "order_carrier_id",
              "tracking_number", "admin_order_total", "admin_order_state_id_before",
              "admin_order_state_id_after", "admin_route_class_before_update",
              "admin_route_class_after_save", "admin_route_class_after_fresh_get",
              "customer_detail_route_class", "admin_origin_matches", "admin_folder_matches",
              "admin_order_id_matches", "admin_post_save_order_id_matches",
              "admin_fresh_get_order_id_matches", "admin_fresh_get_method_get", "customer_origin_matches",
              "customer_order_id_matches", "admin_and_customer_order_ids_match",
              "admin_and_customer_tracking_number_matches",
              "admin_fresh_document_readback", "customer_same_order_detail_readback",
              "admin_order_state_preserved", "admin_shipping_total", "order_state_paid",
              "total_paid_real", "shipping_total", "free_shipping_preserved",
              "physical_dispatch_performed", "carrier_scan_performed",
          )
          projected = {key: payload[key] for key in keys}
          with open(output_path, "w", encoding="utf-8") as stream:
              json.dump(projected, stream, ensure_ascii=True, sort_keys=True)
              stream.write("\n")
          PY
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_ci_free_shipping_tracking.php' \
            < tests/postcode/verify_ci_free_shipping_tracking.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/ci-shipping-free-order-tracking.json' < "$projected_input"
          if ! docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e KURANEA_CI_TRACKING_INPUT_PATH=/tmp/ci-shipping-free-order-tracking.json \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/verify_ci_free_shipping_tracking.php \
            > "$persistence_result" 2> "$persistence_log"; then
            cat "$persistence_log" >&2
            exit 1
          fi
          cat "$persistence_log"
          python3 - "$projected_input" "$persistence_result" <<'PY'
          import json
          import sys

          input_path, result_path = sys.argv[1:]
          with open(input_path, encoding="utf-8") as stream:
              source = json.load(stream)
          with open(result_path, encoding="utf-8") as stream:
              result = json.load(stream)
          expected_true = (
              "synthetic_ci_only", "read_only_database_readback", "native_order_loaded",
              "native_order_carrier_loaded", "order_reference_matches",
              "order_carrier_order_id_matches", "tracking_number_matches_browser",
              "admin_origin_matches", "admin_folder_matches", "admin_order_id_matches",
              "admin_post_save_order_id_matches", "admin_fresh_get_order_id_matches",
              "admin_fresh_get_method_get",
              "customer_origin_matches", "customer_order_id_matches",
              "admin_and_customer_order_ids_match", "admin_and_customer_tracking_number_matches",
              "admin_fresh_document_readback", "customer_same_order_detail_readback",
              "admin_order_state_preserved", "same_order_and_tracking_persisted",
          )
          safe_route_classes = {
              "admin_route_class_before_update": {"modern_order_detail", "legacy_order_detail"},
              "admin_route_class_after_save": {"modern_order_detail", "legacy_order_detail"},
              "admin_route_class_after_fresh_get": {"modern_order_detail", "legacy_order_detail"},
              "customer_detail_route_class": {"order_detail_controller", "friendly_order_detail"},
          }
          valid = (
              isinstance(source, dict)
              and isinstance(result, dict)
              and all(result.get(key) is True for key in expected_true)
              and all(result.get(key) in allowed for key, allowed in safe_route_classes.items())
              and type(result.get("order_id")) is int
              and result["order_id"] == source["order_id"]
              and type(result.get("order_carrier_id")) is int
              and result["order_carrier_id"] == source["order_carrier_id"]
              and type(result.get("carrier_id")) is int
              and result["carrier_id"] == source["carrier_id"]
              and result.get("tracking_number") == source["tracking_number"]
              and result.get("order_state_id") == source["admin_order_state_id_after"]
              and result.get("admin_fresh_get_method_get") is True
              and result.get("order_state_paid") is False
              and result.get("total_paid_real") == 0
              and result.get("total_shipping_tax_excl") == 0
              and result.get("total_shipping_tax_incl") == 0
              and result.get("total_paid_tax_incl") == source["admin_order_total"]
              and result.get("currency") == "JPY"
              and result.get("payment_module") == "ps_checkpayment"
              and result.get("carrier_tracking_destination_configured") is False
              and result.get("physical_dispatch_performed") is False
              and result.get("carrier_scan_performed") is False
              and not any("url" in key.casefold() or "token" in key.casefold() for key in result)
          )
          if not valid:
              raise SystemExit("The native tracking readback JSON failed its same-order safe schema.")
          PY

      - name: Restore the fail-closed base checkout environment
        id: checkout_restore
        if: always() && steps.checkout_override.outcome != 'skipped' && (env.ORDENOWA_ADMIN_QA_FOCUS != 'true' || env.ORDENOWA_ADMIN_RETURN_FOCUS == 'true')
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" \
            up -d --no-deps --force-recreate --wait --wait-timeout 300 prestashop

      - name: Recheck storefront checkout stays gated after unpaid CI order QA
        id: checkout_gate_after_order
        if: always() && (steps.checkout_override.outcome == 'success' || steps.checkout_override.outcome == 'failure') && steps.checkout_restore.outcome == 'success' && (env.ORDENOWA_ADMIN_QA_FOCUS != 'true' || env.ORDENOWA_ADMIN_RETURN_FOCUS == 'true')
        continue-on-error: true
        shell: bash
        env:
          SHOP_BASE_URL: http://127.0.0.1:18080
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
        run: |
          set -euo pipefail
          product_id=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T mariadb \
            sh -ec 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb --protocol=tcp -h127.0.0.1 -uroot -N "$MARIADB_DATABASE" -e "SELECT id_product FROM ps_product WHERE reference LIKE \"KURANEA-CI-%\" AND active=1 ORDER BY id_product DESC LIMIT 1"')
          CI_TEST_PRODUCT_ID="$product_id" \
            "$RUNNER_TEMP/ordenowa-browser-venv/bin/python" \
            tests/e2e/verify_storefront_browser.py \
            2>&1 | tee "$RUNNER_TEMP/ordenowa-browser-qa/storefront-checkout-gate-after-ci-order.log"

      - name: Prepare CI-only paid-like order for return verification
        id: order_lifecycle_fixture
        if: steps.checkout_order_persistence.outcome == 'success' && steps.checkout_gate_after_order.outcome == 'success' && (env.ORDENOWA_ADMIN_QA_FOCUS != 'true' || env.ORDENOWA_ADMIN_RETURN_FOCUS == 'true')
        continue-on-error: true
        shell: bash
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          desktop_order_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["order_id"])' \
            "$QA_ARTIFACT_DIR/ci-checkout-desktop.json")
          mobile_order_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["order_id"])' \
            "$QA_ARTIFACT_DIR/ci-checkout-mobile.json")
          if ! [[ "$desktop_order_id" =~ ^[0-9]+$ ]] || [ "$desktop_order_id" -lt 1 ] \
            || ! [[ "$mobile_order_id" =~ ^[0-9]+$ ]] || [ "$mobile_order_id" -lt 1 ] \
            || [ "$desktop_order_id" -eq "$mobile_order_id" ]; then
            echo '::error title=ORDENOWA native order lifecycle fixture::Browser order IDs were invalid or not distinct.'
            exit 1
          fi
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/prepare_ci_native_order_lifecycle.php' \
            < tests/postcode/prepare_ci_native_order_lifecycle.php
          fixture_stdout="$RUNNER_TEMP/order-lifecycle-fixture.stdout"
          if ! docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e KURANEA_CI_PAID_LIKE_SOURCE_ORDER_ID="$mobile_order_id" \
            -e KURANEA_CI_UNPAID_ORDER_ID="$desktop_order_id" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/prepare_ci_native_order_lifecycle.php \
            > "$fixture_stdout" 2> "$RUNNER_TEMP/order-lifecycle-fixture.stderr"; then
            cat "$RUNNER_TEMP/order-lifecycle-fixture.stderr" >&2
            exit 1
          fi
          fixture_payload=$(sed -n '1p' "$fixture_stdout")
          paid_like_order_id=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("status")=="prepared" and d.get("synthetic CI-only") is True and d.get("provider_call") is False; print(d["paid_like_order_id"])' "$fixture_payload")
          if ! [[ "$paid_like_order_id" =~ ^[0-9]+$ ]] || [ "$paid_like_order_id" -lt 1 ]; then
            echo '::error title=ORDENOWA native order lifecycle fixture::The synthetic paid-like fixture returned an invalid order ID.'
            exit 1
          fi
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(json.dumps({"status":d["status"],"paid_like_order_id":int(d["paid_like_order_id"]),"synthetic_ci_only":d["synthetic CI-only"],"provider_call":d["provider_call"],"cash_refund":d["cash_refund"]},sort_keys=True))' \
            "$fixture_payload" > "$QA_ARTIFACT_DIR/order-lifecycle-preparation.json"
          printf 'paid_like_order_id=%s\n' "$paid_like_order_id" >> "$GITHUB_OUTPUT"
          printf 'unpaid_order_id=%s\n' "$desktop_order_id" >> "$GITHUB_OUTPUT"
          printf 'PASS: the mobile fixture is marked synthetic CI-only; no payment provider or funds were used.\n' \
            | tee "$QA_ARTIFACT_DIR/order-lifecycle-e2e.log"
          rm -f -- "$fixture_stdout" "$RUNNER_TEMP/order-lifecycle-fixture.stderr"

      - name: Submit customer return request in Chromium
