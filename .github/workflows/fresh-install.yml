          for entry in \
            "shipping_product_fixture=$SHIPPING_PRODUCT_FIXTURE_OUTCOME" \
            "tax_fixture=$TAX_FIXTURE_OUTCOME" \
            "variant_fixture=$VARIANT_FIXTURE_OUTCOME" \
