      - name: Start disposable Mailpit for customer password-reset email
        if: ${{ (env.ORDENOWA_ADMIN_QA_FOCUS != 'true' || env.ORDENOWA_ADMIN_RETURN_FOCUS == 'true' || env.ORDENOWA_CUSTOMER_ACCOUNT_FOCUS == 'true') }}
        id: mailpit_setup
        shell: bash
        run: |
          set -euo pipefail
          mailpit_name="${CI_COMPOSE_PROJECT_NAME}-mailpit"
          if ! existing_mailpit=$(docker ps -a --filter "name=^/${mailpit_name}$" --format '{{.ID}}|{{.Names}}'); then
            echo '::error title=ORDENOWA Mailpit preflight::Docker could not verify the run-scoped Mailpit name.'
            exit 1
          fi
          if [[ -n "$existing_mailpit" ]]; then
            echo '::error title=ORDENOWA Mailpit preflight::The run-scoped Mailpit name is already in use; the existing container was preserved.'
            exit 1
          fi
          mailpit_created=0
          cleanup_mailpit_setup() {
            local result=$?
            trap - EXIT
            if [[ "$mailpit_created" == 1 ]] && ! docker rm -f "$mailpit_name" >/dev/null 2>&1; then
              echo 'Mailpit setup cleanup failed for the container created by this step.' >&2
              result=1
            fi
            exit "$result"
          }
          trap cleanup_mailpit_setup EXIT
          docker run --detach --rm \
            --name "$mailpit_name" \
            --network "${CI_COMPOSE_PROJECT_NAME}_default" \
            --network-alias mailpit \
            --publish 127.0.0.1:8025:8025 \
            axllent/mailpit:v1.31.6
          mailpit_created=1
          printf 'mailpit_owned=true\n' >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8025/api/v1/messages >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Mailpit did not become ready for the isolated account test.' >&2
              exit 1
            fi
            sleep 1
          done
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop php -r '
            require "/var/www/html/config/config.inc.php";
            $expected = [
                "PS_MAIL_METHOD" => 2,
                "PS_MAIL_SERVER" => "mailpit",
                "PS_MAIL_SMTP_PORT" => 1025,
                "PS_MAIL_USER" => "",
                "PS_MAIL_PASSWD" => "",
                "PS_MAIL_SMTP_ENCRYPTION" => "",
            ];
            foreach ($expected as $key => $value) {
                if (!Configuration::updateValue($key, $value)) {
                    fwrite(STDERR, "PrestaShop could not save isolated Mailpit SMTP configuration.\n");
                    exit(1);
                }
                if ((string) Configuration::get($key) !== (string) $value) {
                    fwrite(STDERR, "PrestaShop did not retain isolated Mailpit SMTP configuration.\n");
                    exit(1);
                }
            }
          '
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop php -r '
            $socket = @fsockopen("mailpit", 1025, $errorCode, $errorMessage, 5);
            if ($socket === false) {
                fwrite(STDERR, "PrestaShop cannot reach the disposable Mailpit SMTP listener.\n");
                exit(1);
            }
            fclose($socket);
          '
          trap - EXIT

