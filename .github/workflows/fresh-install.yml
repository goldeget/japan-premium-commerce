name: Isolated fresh install

on:
  workflow_dispatch:
  push:
    branches: [work, qa/ordenowa-product-browser-20261022]
    paths:
      - '.github/workflows/fresh-install.yml'
      - 'compose.yaml'
      - 'Dockerfile'
      - 'docker/**'
      - 'themes/**'
      - 'modules/kuraneapostcode/**'
      - 'modules/kuraneabackoffice/**'
      - 'modules/kuraneabusinessprofile/**'
      - 'modules/kuraneacatalog/**'
      - 'tests/business_profile/**'
      - 'tests/catalog/**'
      - 'assets/brand/ordenowa/**'
      - 'tests/smoke/fresh_install.sh'
      - 'tests/smoke/run_postal_updater.sh'
      - 'tests/smoke/collect_failure_diagnostics.sh'
      - 'tests/smoke/test_admin_folder_install_order.py'
      - 'tests/smoke/test_docker_run_recovery.py'
      - 'tests/smoke/test_ci_diagnostics_script.py'
      - 'tests/smoke/test_ci_checkout_contract.py'
      - 'tests/smoke/test_product_admin_contract.py'
      - 'tests/smoke/test_browser_qa_artifacts_contract.py'
      - 'tests/smoke/test_fresh_install_workflow_contract.py'
      - 'tests/smoke/test_customer_account_browser_flow_contract.py'
      - 'tests/smoke/test_korean_customer_login_contract.py'
      - 'tests/smoke/test_reset_email_brand_contract.py'
      - 'tests/smoke/test_free_shipping_e2e_contract.py'
      - 'tests/smoke/test_product_tax_rules_contract.py'
      - 'tests/smoke/test_variant_fixture_contract.py'
      - 'tests/smoke/test_cart_controls_browser_contract.py'
      - 'tests/smoke/test_security_runtime_e2e_contract.py'
      - 'tests/smoke/test_pwa_service_worker.py'
      - 'tests/smoke/test_taxable_checkout_browser_contract.py'
      - 'tests/smoke/test_isolated_browser_target_guards.py'
      - 'tests/smoke/test_isolated_ci_integration_workflow_contract.py'
      - 'tests/smoke/test_currency_bootstrap_contract.py'
      - 'tests/smoke/test_saved_order_tax_contract.py'
      - 'tests/smoke/test_product_admin_browser_guard.py'
      - 'tests/fixtures/ci-checkout.compose.yaml'
      - 'tests/postcode/**'
      - 'tests/e2e/**'
      - 'tests/catalog/verify_native_registration.php'
  pull_request:
    branches: [work, qa/ordenowa-product-browser-20261022]
    paths:
      - '.github/workflows/fresh-install.yml'
      - 'compose.yaml'
      - 'Dockerfile'
      - 'docker/**'
      - 'themes/**'
      - 'modules/kuraneapostcode/**'
      - 'modules/kuraneabackoffice/**'
      - 'modules/kuraneabusinessprofile/**'
      - 'modules/kuraneacatalog/**'
      - 'tests/business_profile/**'
      - 'tests/catalog/**'
      - 'assets/brand/ordenowa/**'
      - 'tests/smoke/fresh_install.sh'
      - 'tests/smoke/run_postal_updater.sh'
      - 'tests/smoke/collect_failure_diagnostics.sh'
      - 'tests/smoke/test_admin_folder_install_order.py'
      - 'tests/smoke/test_docker_run_recovery.py'
      - 'tests/smoke/test_ci_diagnostics_script.py'
      - 'tests/smoke/test_ci_checkout_contract.py'
      - 'tests/smoke/test_product_admin_contract.py'
      - 'tests/smoke/test_browser_qa_artifacts_contract.py'
      - 'tests/smoke/test_fresh_install_workflow_contract.py'
      - 'tests/smoke/test_customer_account_browser_flow_contract.py'
      - 'tests/smoke/test_korean_customer_login_contract.py'
      - 'tests/smoke/test_reset_email_brand_contract.py'
      - 'tests/smoke/test_free_shipping_e2e_contract.py'
      - 'tests/smoke/test_product_tax_rules_contract.py'
      - 'tests/smoke/test_variant_fixture_contract.py'
      - 'tests/smoke/test_cart_controls_browser_contract.py'
      - 'tests/smoke/test_security_runtime_e2e_contract.py'
      - 'tests/smoke/test_pwa_service_worker.py'
      - 'tests/smoke/test_taxable_checkout_browser_contract.py'
      - 'tests/smoke/test_isolated_browser_target_guards.py'
      - 'tests/smoke/test_isolated_ci_integration_workflow_contract.py'
      - 'tests/smoke/test_currency_bootstrap_contract.py'
      - 'tests/smoke/test_saved_order_tax_contract.py'
      - 'tests/smoke/test_product_admin_browser_guard.py'
      - 'tests/fixtures/ci-checkout.compose.yaml'
      - 'tests/postcode/**'
      - 'tests/e2e/**'
      - 'tests/catalog/verify_native_registration.php'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_COMPOSE_PROJECT_NAME: kuranea-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SHOP_PORT: 18080
      KURANEA_ISOLATED_CI: '1'
    steps:
      - name: Check out work and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare disposable test credentials
        shell: bash
        run: |
          cat > .env <<'EOF'
          MARIADB_DATABASE=prestashop
          MARIADB_USER=prestashop
          MARIADB_PASSWORD=ci-only-db-password
          MARIADB_ROOT_PASSWORD=ci-only-root-password
          ADMIN_MAIL=ci-ordenowa@example.invalid
          ADMIN_PASSWD=Ci-Only-Admin-Password-92!
          EOF

      - name: Validate Compose configuration
        run: docker compose -p "$CI_COMPOSE_PROJECT_NAME" config --quiet

      - name: Verify Japan Post refresh command contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/postcode -p 'test_*.py' -v

      - name: Verify PrestaShop admin install order contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.smoke.test_admin_folder_install_order -v

      - name: Verify Docker startup cleanup regression contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.smoke.test_docker_run_recovery -v

      - name: Verify fresh-install workflow contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.smoke.test_fresh_install_workflow_contract tests.smoke.test_browser_qa_artifacts_contract tests.smoke.test_customer_account_browser_flow_contract tests.smoke.test_korean_customer_login_contract tests.smoke.test_reset_email_brand_contract tests.smoke.test_free_shipping_e2e_contract tests.smoke.test_product_tax_rules_contract tests.smoke.test_variant_fixture_contract tests.smoke.test_cart_controls_browser_contract tests.smoke.test_security_runtime_e2e_contract tests.smoke.test_pwa_service_worker tests.smoke.test_taxable_checkout_browser_contract tests.smoke.test_isolated_browser_target_guards tests.smoke.test_isolated_ci_integration_workflow_contract tests.smoke.test_currency_bootstrap_contract tests.smoke.test_saved_order_tax_contract tests.smoke.test_product_admin_browser_guard -v

      - name: Verify isolated unpaid checkout contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.smoke.test_ci_checkout_contract tests.business_profile.test_admin_tab_navigation_contract tests.business_profile.test_admin_access_source_contract -v

      - name: Verify Korean native product manager contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.smoke.test_product_admin_contract -v

      - name: Verify official ORDENOWA brand pack integrity and runtime wiring
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.smoke.test_ordenowa_brand_pack -v

      - name: Build the PrestaShop image
        id: image_build
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" build --progress=plain prestashop

      - name: Verify fresh cache ownership in an isolated probe project
        id: cache_probe
        shell: bash
        run: |
          set -euo pipefail
          probe_project="${CI_COMPOSE_PROJECT_NAME}-cache-probe"
          cleanup_probe() {
            docker compose -p "$probe_project" down -v --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup_probe EXIT
          docker compose -p "$probe_project" run --rm --no-deps --entrypoint /bin/sh prestashop -ec '
            cache_dir=/var/www/html/var/cache/prod
            mkdir -p "$cache_dir"
            printf stale > "$cache_dir/class_index.php"
            chown -R root:root "$cache_dir"
            /tmp/pre-install-scripts/10-kuranea-cache-ownership.sh
            test "$(stat -c "%U:%G" "$cache_dir/class_index.php")" = www-data:www-data
            runuser -g www-data -u www-data -- test -w "$cache_dir/class_index.php"
          '
          cleanup_probe
          trap - EXIT

      - name: Start the empty-volume shop
        id: compose_up
        shell: bash
        run: docker compose -p "$CI_COMPOSE_PROJECT_NAME" up -d --wait --wait-timeout 900

      - name: Verify the first empty-volume bootstrap marker
        shell: bash
        run: |
          set -euo pipefail
          startup_logs=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" logs --no-color prestashop 2>&1)
          grep -q 'ORDENOWA bootstrap: storefront=ja, en/ko=enabled, admin=ko, theme=kuranea' <<< "$startup_logs"

      - name: Verify the installed KURANEA catalog review module and persistent queue
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            mkdir -p /tmp/kuranea-catalog-fixtures
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/kuranea-catalog-fixtures/amazon-jp-product.synthetic.html' \
            < tests/catalog/fixtures/amazon-jp-product.synthetic.html
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_catalog_installation.php' \
            < tests/catalog/verify_catalog_installation.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            runuser -g www-data -u www-data -- php /tmp/verify_catalog_installation.php

      - name: Verify Japanese and Korean native product draft validation in PHP
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/product_admin_draft.php' \
            < tests/catalog/product_admin_draft.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            runuser -g www-data -u www-data -- php -r \
            'require "/var/www/html/modules/kuraneacatalog/autoload.php"; require "/tmp/product_admin_draft.php"; echo "PASS: Japanese and Korean product draft boundaries.\n";'

      - name: Verify native inactive Korean admin product create and edit persistence
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_native_product_admin.php' \
            < tests/catalog/verify_native_product_admin.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e KURANEA_CI_RUN_ID="$GITHUB_RUN_ID" \
            -e KURANEA_CI_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/verify_native_product_admin.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" restart prestashop
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" up -d --wait --wait-timeout 300 prestashop
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            runuser -g www-data -u www-data -- php /tmp/verify_catalog_installation.php

      - name: Verify reviewed synthetic product is registered as an inactive native product
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_native_registration.php' \
            < tests/catalog/verify_native_registration.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI="$CI" -e GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e KURANEA_CI_RUN_ID="$GITHUB_RUN_ID" \
            -e KURANEA_CI_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/verify_native_registration.php

      - name: Prepare isolated active product for storefront and free-shipping QA
        id: shipping_product_fixture
        if: always() && !cancelled() && steps.compose_up.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ordenowa-browser-qa"
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/prepare_ci_free_shipping_product.php' \
            < tests/catalog/prepare_ci_free_shipping_product.php
          fixture_log="$RUNNER_TEMP/ordenowa-browser-qa/free-shipping-product-fixture.log"
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e GITHUB_ACTIONS=true \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e KURANEA_ISOLATED_CI=1 -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/prepare_ci_free_shipping_product.php 2>&1 | tee "$fixture_log"
          fixture_json="$RUNNER_TEMP/ordenowa-browser-qa/free-shipping-product-fixture.json"
          python3 - "$fixture_log" "$fixture_json" <<'PY'
          import json, pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          payloads = [line for line in lines if line.startswith("{\"product_id\"")]
          assert len(payloads) == 1, "active free-shipping product JSON is missing or ambiguous"
          fixture = json.loads(payloads[0])
          assert int(fixture["product_id"]) > 0
          assert fixture["price_jpy"] == 1000
          assert fixture["tax_rules_group_id"] == 0
          assert fixture["tax_scope"] == "unassigned rule group for an isolated free-shipping fixture; not a legal tax determination"
          assert fixture["fixture_scope"] == "run-scoped isolated GitHub Actions disposable checkout database"
          pathlib.Path(sys.argv[2]).write_text(json.dumps(fixture, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"CI_TEST_PRODUCT_ID={fixture['product_id']}")
          print("CI_TEST_PRODUCT_TAX_GROUP=0")
          PY
          product_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["product_id"])' "$fixture_json")
          printf 'CI_TEST_PRODUCT_ID=%s\nCI_TEST_PRODUCT_TAX_GROUP=0\n' "$product_id" >> "$GITHUB_ENV"

      - name: Import synthetic Tokyo postcode fixture for isolated checkout QA
        id: postcode_fixture
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/ordenowa-browser-qa"
          postcode_stage="osaka_state"
          postcode_stage_log="$RUNNER_TEMP/ordenowa-browser-qa/postcode-fixture-osaka-state.log"
          report_postcode_fixture_failure() {
            local status=$?
            trap - ERR
            set +e
            local detail
            detail=$(tail -n 4 "$postcode_stage_log" 2>/dev/null | tr '\r\n' ' ' | cut -c1-500)
            detail=${detail//%/%25}
            printf '::error title=ORDENOWA postcode fixture::phase=%s; exit=%s; %s\n' \
              "$postcode_stage" "$status" "$detail"
            exit "$status"
          }
          trap report_postcode_fixture_failure ERR
          # These two records follow the public KEN_ALL column layout, but are
          # synthetic CI inputs, NOT official Japan Post data.
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop php - \
            <<'PHP' 2>&1 | tee "$postcode_stage_log"
          <?php
          $_SERVER['HTTP_HOST'] = 'localhost:8080';
          $_SERVER['REQUEST_URI'] = '/';
          $_SERVER['SCRIPT_NAME'] = '/index.php';
          $_SERVER['SERVER_PORT'] = '8080';
          require '/var/www/html/config/config.inc.php';
          $countryId = (int) Country::getByIso('JP');
          if ($countryId < 1) {
              fwrite(STDERR, "Japan is missing from the isolated test shop.\n");
              exit(1);
          }
          $stateId = (int) Db::getInstance()->getValue(
              "SELECT id_state FROM " . _DB_PREFIX_ . "state WHERE id_country = " . $countryId . " AND iso_code = 'JP-27' LIMIT 1"
          );
          $state = $stateId > 0 ? new State($stateId) : new State();
          $state->id_country = $countryId;
          $state->id_zone = (int) (new Country($countryId))->id_zone;
          $state->iso_code = 'JP-27';
          $state->active = 1;
          $state->name = '大阪府';
          $saved = $stateId > 0 ? $state->update() : $state->add();
          if (!$saved) {
              fwrite(STDERR, "Could not prepare the isolated JP-27 Osaka region fixture.\n");
              exit(1);
          }
          fwrite(STDOUT, "PASS: isolated CI Osaka region JP-27 is active for the supported-region checkout.\n");
          PHP
          postcode_stage="synthetic_csv"
          postcode_stage_log="$RUNNER_TEMP/ordenowa-browser-qa/postcode-fixture-synthetic-csv.log"
          {
            printf '%s\n' \
              '"13101","","1000004","","","","東京都","千代田区","大手町","","","","","",""' \
              '"27127","","5300001","","","","大阪府","大阪市北区","梅田","","","","","",""'
          } \
            | docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
                sh -c 'cat > /tmp/ordenowa-ci-only-ken-all.csv' 2>&1 \
            | tee "$postcode_stage_log"
          postcode_stage="ken_all_import"
          postcode_stage_log="$RUNNER_TEMP/ordenowa-browser-qa/postcode-fixture-import.log"
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            runuser -g www-data -u www-data -- \
            php /var/www/html/modules/kuraneapostcode/bin/import-ken-all.php \
              --file=/tmp/ordenowa-ci-only-ken-all.csv 2>&1 \
            | tee "$postcode_stage_log"
          postcode_stage="verify_imported_rows"
          postcode_stage_log="$RUNNER_TEMP/ordenowa-browser-qa/postcode-fixture-import-counts.log"
          counts=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T mariadb \
            sh -ec 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb --protocol=tcp -h127.0.0.1 -uroot -N "$MARIADB_DATABASE" -e "SELECT COUNT(*), COALESCE(SUM(postcode=\"1000004\" AND jis_code=\"13101\"),0), COALESCE(SUM(postcode=\"5300001\" AND jis_code=\"27127\"),0) FROM ps_kuraneapostcode_address WHERE postcode IN (\"1000004\",\"5300001\")"' \
            2>&1 | tee "$postcode_stage_log")
          IFS=$'\t' read -r total_rows tokyo_rows osaka_rows <<< "$counts"
          if [[ "$total_rows" != "2" || "$tokyo_rows" != "1" || "$osaka_rows" != "1" ]]; then
            echo "::error title=ORDENOWA postcode fixture::phase=verify_imported_rows; expected_total=2; observed_total=$total_rows; tokyo=$tokyo_rows; osaka=$osaka_rows"
            exit 1
          fi
          printf '%s\n' 'ISOLATED CI FIXTURES: Tokyo 100-0004 and Osaka 530-0001 use synthetic KEN_ALL-layout data; official Japan Post archive import runs separately afterwards.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify isolated CI Tokyo postcode lookup
        id: postcode_lookup
        if: always() && !cancelled() && steps.postcode_fixture.outcome == 'success'
        continue-on-error: true
        env:
          SHOP_BASE_URL: http://127.0.0.1:18080
        run: |
          set -euo pipefail
          payload=$(curl --fail --silent --show-error --location --get "$SHOP_BASE_URL/" \
            --data-urlencode 'fc=module' \
            --data-urlencode 'module=kuraneapostcode' \
            --data-urlencode 'controller=candidates' \
            --data-urlencode 'q=1000004')
          osaka_payload=$(curl --fail --silent --show-error --location --get "$SHOP_BASE_URL/" \
            --data-urlencode 'fc=module' \
            --data-urlencode 'module=kuraneapostcode' \
            --data-urlencode 'controller=candidates' \
            --data-urlencode 'q=5300001')
          python3 - "$payload" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          assert data.get("manual_entry_available") is True
          assert any(
              item.get("postcode") == "100-0004"
              and item.get("prefecture") == "東京都"
              and item.get("municipality") == "千代田区"
              and item.get("town") == "大手町"
              for item in data.get("candidates", [])
          ), data
          print("PASS: synthetic CI postcode 1000004 resolves to Tokyo / Chiyoda / Otemachi")
          PY
          python3 - "$osaka_payload" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          assert data.get("manual_entry_available") is True
          assert any(
              item.get("postcode") == "530-0001"
              and item.get("prefecture") == "大阪府"
              and item.get("municipality") == "大阪市北区"
              and item.get("town") == "梅田"
              for item in data.get("candidates", [])
          ), data
          print("PASS: synthetic CI postcode 5300001 resolves to Osaka / Kita / Umeda")
          PY

      - name: Verify saved native CI Tokyo address
        id: native_address_persistence
        if: always() && !cancelled() && steps.postcode_fixture.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_native_address_persistence.php' \
            < tests/postcode/verify_native_address_persistence.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            prestashop \
            runuser -g www-data -u www-data -- php /tmp/verify_native_address_persistence.php

      - name: Verify synthetic Tokyo address in an unpaid native order and Back Office view
        id: native_order_persistence
        if: always() && !cancelled() && steps.postcode_fixture.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_native_order_persistence.php' \
            < tests/postcode/verify_native_order_persistence.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI="$CI" \
            -e GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e KURANEA_CI_RUN_ID="$GITHUB_RUN_ID" \
            -e KURANEA_CI_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/verify_native_order_persistence.php

      - name: Start disposable Mailpit for customer password-reset email
        id: mailpit_setup
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm \
            --name "${CI_COMPOSE_PROJECT_NAME}-mailpit" \
            --network "${CI_COMPOSE_PROJECT_NAME}_default" \
            --network-alias mailpit \
            --publish 127.0.0.1:8025:8025 \
            axllent/mailpit:v1.31.6
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8025/api/v1/messages >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Mailpit did not become ready for the isolated account test.' >&2
              exit 1
            fi
            sleep 1
          done
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop php -r '
