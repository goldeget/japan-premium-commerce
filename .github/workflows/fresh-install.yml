        if: success() && steps.chromium_setup.outcome == 'success' && steps.cjk_font_archive_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "$RUNNER_TEMP/ordenowa-cjk-apt-cache/archives/*.deb" > /dev/null; then
            echo 'cacheable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'cacheable=false' >> "$GITHUB_OUTPUT"
            echo 'No downloaded font package archives; cache save skipped.'
          fi

      - name: Save Chromium font package archives
        if: steps.cjk_font_archive_status.outputs.cacheable == 'true'
