                  + (failure_line or "See the browser log for the failing stage.")
                  + "\n"
              )
              for line in (diagnostics_line, stale_target_line, admin_login_safe_state):
                  if line:
                      summary.write(line + "\n")

          for title, line in (
              ("ORDENOWA brand page state", diagnostics_line),
              ("ORDENOWA admin login safe state", admin_login_safe_state),
          ):
              if line:
                  annotation = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
