              ('reset_expired_customer_email', 'EXPIRED_CUSTOMER_EMAIL', 'ordenowa-reset-token-expired'),
          ):
              email = fixture.get(key) if isinstance(fixture, dict) else None
              if not isinstance(email, str) or not re.fullmatch(rf'{prefix}-{run_id}-{attempt}-[a-f0-9]+@example\.invalid', email):
                  raise SystemExit('security fixture email did not match the isolated run')
              values.append(f'{variable}={email}\n')
          with open(sys.argv[2], 'a', encoding='utf-8') as output:
              output.writelines(values)
          PY

