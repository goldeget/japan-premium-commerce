                profile_diagnostics_annotation=${profile_diagnostics_annotation//$'\n'/'%0A'}
                printf '::error title=Customer account profile update safe state::%s\n' "$profile_diagnostics_annotation"
              done <<< "$profile_diagnostics_lines"
            fi
            if [ -n "$email_login_diagnostics" ]; then
              while IFS= read -r email_login_diagnostics_line; do
                printf '%s\n' "$email_login_diagnostics_line" >> "$GITHUB_STEP_SUMMARY"
              done <<< "$email_login_diagnostics"
            fi
            exit "$browser_status"
          fi

