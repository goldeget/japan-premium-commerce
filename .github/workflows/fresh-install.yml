name: Isolated fresh install

on:
  workflow_dispatch:
  push:
    branches: [work, qa/ordenowa-product-browser-20261022]
    paths:
      - '.github/workflows/fresh-install.yml'
      - 'compose.yaml'
      - 'Dockerfile'
      - 'docker/**'
      - 'themes/**'
      - 'modules/kuraneapostcode/**'
      - 'modules/kuraneabackoffice/**'
      - 'modules/kuraneabusinessprofile/**'
      - 'modules/kuraneacatalog/**'
      - 'tests/business_profile/**'
      - 'tests/catalog/**'
      - 'assets/brand/ordenowa/**'
      - 'tests/smoke/fresh_install.sh'
      - 'tests/smoke/run_postal_updater.sh'
      - 'tests/smoke/collect_failure_diagnostics.sh'
      - 'tests/smoke/test_admin_folder_install_order.py'
      - 'tests/smoke/test_docker_run_recovery.py'
      - 'tests/smoke/test_ci_diagnostics_script.py'
      - 'tests/smoke/test_ci_checkout_contract.py'
      - 'tests/smoke/test_product_admin_contract.py'
      - 'tests/smoke/test_browser_qa_artifacts_contract.py'
      - 'tests/fixtures/ci-checkout.compose.yaml'
      - 'tests/postcode/**'
      - 'tests/e2e/**'
      - 'tests/catalog/verify_native_registration.php'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI_COMPOSE_PROJECT_NAME: kuranea-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SHOP_PORT: 18080
    steps:
      - name: Check out work and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare disposable test credentials
        shell: bash
        run: |
          cat > .env <<'EOF'
          MARIADB_DATABASE=prestashop
          MARIADB_USER=prestashop
          MARIADB_PASSWORD=ci-only-db-password
          MARIADB_ROOT_PASSWORD=ci-only-root-password
          ADMIN_MAIL=ci-kuranea@example.invalid
          ADMIN_PASSWD=Ci-Only-Admin-Password-92!
          EOF

      - name: Validate Compose configuration
        run: docker compose -p "$CI_COMPOSE_PROJECT_NAME" config --quiet

      - name: Verify Japan Post refresh command contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/postcode -p 'test_*.py' -v

      - name: Verify PrestaShop admin install order contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.smoke.test_admin_folder_install_order -v

      - name: Verify Docker startup cleanup regression contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.smoke.test_docker_run_recovery -v

      - name: Verify fresh-install workflow contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.smoke.test_fresh_install_workflow_contract tests.smoke.test_browser_qa_artifacts_contract -v

      - name: Verify isolated unpaid checkout contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.smoke.test_ci_checkout_contract tests.business_profile.test_admin_tab_navigation_contract tests.business_profile.test_admin_access_source_contract -v

      - name: Verify Korean native product manager contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.smoke.test_product_admin_contract -v

      - name: Verify official ORDENOWA brand pack integrity and runtime wiring
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.smoke.test_ordenowa_brand_pack -v

      - name: Build the PrestaShop image
        id: image_build
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" build --progress=plain prestashop

      - name: Verify fresh cache ownership in an isolated probe project
        id: cache_probe
        shell: bash
        run: |
          set -euo pipefail
          probe_project="${CI_COMPOSE_PROJECT_NAME}-cache-probe"
          cleanup_probe() {
            docker compose -p "$probe_project" down -v --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup_probe EXIT
          docker compose -p "$probe_project" run --rm --no-deps --entrypoint /bin/sh prestashop -ec '
            cache_dir=/var/www/html/var/cache/prod
            mkdir -p "$cache_dir"
            printf stale > "$cache_dir/class_index.php"
            chown -R root:root "$cache_dir"
            /tmp/pre-install-scripts/10-kuranea-cache-ownership.sh
            test "$(stat -c "%U:%G" "$cache_dir/class_index.php")" = www-data:www-data
            runuser -g www-data -u www-data -- test -w "$cache_dir/class_index.php"
          '
          cleanup_probe
          trap - EXIT

      - name: Start the empty-volume shop
        id: compose_up
        shell: bash
        run: docker compose -p "$CI_COMPOSE_PROJECT_NAME" up -d --wait --wait-timeout 900

      - name: Verify the first empty-volume bootstrap marker
        shell: bash
        run: |
          set -euo pipefail
          startup_logs=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" logs --no-color prestashop 2>&1)
          grep -q 'ORDENOWA bootstrap: storefront=ja, en/ko=enabled, admin=ko, theme=kuranea' <<< "$startup_logs"

      - name: Verify the installed KURANEA catalog review module and persistent queue
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            mkdir -p /tmp/kuranea-catalog-fixtures
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/kuranea-catalog-fixtures/amazon-jp-product.synthetic.html' \
            < tests/catalog/fixtures/amazon-jp-product.synthetic.html
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_catalog_installation.php' \
            < tests/catalog/verify_catalog_installation.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            runuser -g www-data -u www-data -- php /tmp/verify_catalog_installation.php

      - name: Verify Japanese and Korean native product draft validation in PHP
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/product_admin_draft.php' \
            < tests/catalog/product_admin_draft.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            runuser -g www-data -u www-data -- php -r \
            'require "/var/www/html/modules/kuraneacatalog/autoload.php"; require "/tmp/product_admin_draft.php"; echo "PASS: Japanese and Korean product draft boundaries.\n";'

      - name: Verify native inactive Korean admin product create and edit persistence
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_native_product_admin.php' \
            < tests/catalog/verify_native_product_admin.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e KURANEA_CI_RUN_ID="$GITHUB_RUN_ID" \
            -e KURANEA_CI_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/verify_native_product_admin.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" restart prestashop
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" up -d --wait --wait-timeout 300 prestashop
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            runuser -g www-data -u www-data -- php /tmp/verify_catalog_installation.php

      - name: Verify reviewed synthetic product is registered as an inactive native product
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_native_registration.php' \
            < tests/catalog/verify_native_registration.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI="$CI" -e GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e KURANEA_CI_RUN_ID="$GITHUB_RUN_ID" \
            -e KURANEA_CI_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/verify_native_registration.php

      - name: Import synthetic Tokyo postcode fixture for isolated checkout QA
        shell: bash
        run: |
          set -euo pipefail
          # This single-record test input follows the public KEN_ALL column layout,
          # but it is synthetic CI data, NOT an official Japan Post dataset.
          printf '%s\n' '"13101","","1000004","","","","東京都","千代田区","大手町","","","","","",""' \
            | docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
                sh -c 'cat > /tmp/ordenowa-ci-only-ken-all.csv'
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            runuser -g www-data -u www-data -- \
            php /var/www/html/modules/kuraneapostcode/bin/import-ken-all.php \
              --file=/tmp/ordenowa-ci-only-ken-all.csv
          printf '%s\n' 'ISOLATED CI FIXTURE: address and order tests below use synthetic Tokyo postcode data; official Japan Post archive import runs separately afterwards.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify isolated CI Tokyo postcode lookup
        env:
          SHOP_BASE_URL: http://127.0.0.1:18080
        run: |
          set -euo pipefail
          payload=$(curl --fail --silent --show-error --location --get "$SHOP_BASE_URL/" \
            --data-urlencode 'fc=module' \
            --data-urlencode 'module=kuraneapostcode' \
            --data-urlencode 'controller=candidates' \
            --data-urlencode 'q=1000004')
          python3 - "$payload" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          assert data.get("manual_entry_available") is True
          assert any(
              item.get("postcode") == "100-0004"
              and item.get("prefecture") == "東京都"
              and item.get("municipality") == "千代田区"
              and item.get("town") == "大手町"
              for item in data.get("candidates", [])
          ), data
          print("PASS: synthetic CI postcode 1000004 resolves to Tokyo / Chiyoda / Otemachi")
          PY

      - name: Verify saved native CI Tokyo address
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_native_address_persistence.php' \
            < tests/postcode/verify_native_address_persistence.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            prestashop \
            runuser -g www-data -u www-data -- php /tmp/verify_native_address_persistence.php

      - name: Verify synthetic Tokyo address in an unpaid native order and Back Office view
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_native_order_persistence.php' \
            < tests/postcode/verify_native_order_persistence.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI="$CI" \
            -e GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e KURANEA_CI_RUN_ID="$GITHUB_RUN_ID" \
            -e KURANEA_CI_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/verify_native_order_persistence.php

      - name: Start disposable Mailpit for customer password-reset email
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm \
            --name "${CI_COMPOSE_PROJECT_NAME}-mailpit" \
            --network "${CI_COMPOSE_PROJECT_NAME}_default" \
            --network-alias mailpit \
            --publish 127.0.0.1:8025:8025 \
            axllent/mailpit:v1.31.6
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8025/api/v1/messages >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Mailpit did not become ready for the isolated account test.' >&2
              exit 1
            fi
            sleep 1
          done
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop php -r '
            require "/var/www/html/config/config.inc.php";
            Configuration::updateValue("PS_MAIL_METHOD", 2);
            Configuration::updateValue("PS_MAIL_SERVER", "mailpit");
            Configuration::updateValue("PS_MAIL_SMTP_PORT", 1025);
            Configuration::updateValue("PS_MAIL_USER", "");
            Configuration::updateValue("PS_MAIL_PASSWD", "");
            Configuration::updateValue("PS_MAIL_SMTP_ENCRYPTION", "");
          '
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop php -r '
            $socket = @fsockopen("mailpit", 1025, $errorCode, $errorMessage, 5);
            if ($socket === false) {
                fwrite(STDERR, "PrestaShop cannot reach the disposable Mailpit SMTP listener.\n");
                exit(1);
            }
            fclose($socket);
          '

      - name: Verify ORDENOWA business profile installation and admin access
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_business_profile_install.php' \
            < tests/business_profile/verify_installation.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            runuser -g www-data -u www-data -- php /tmp/verify_business_profile_install.php

      - name: Prepare Chromium browser smoke environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ordenowa-browser-venv"
          "$RUNNER_TEMP/ordenowa-browser-venv/bin/pip" install --disable-pip-version-check --quiet selenium==4.27.1
          command -v google-chrome || command -v chromium
          mkdir -p "$RUNNER_TEMP/ordenowa-browser-qa"

      - name: Verify official ORDENOWA brand upload and publish in Chromium
        id: brand_browser_qa
        continue-on-error: true
        shell: bash
        env:
          SHOP_BASE_URL: http://localhost:18080
          ADMIN_LOGIN_URL: http://localhost:18080/admin-kuranea
          ADMIN_MAIL: ci-kuranea@example.invalid
          ADMIN_PASSWD: Ci-Only-Admin-Password-92!
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/ordenowa-browser-qa/ordenowa-brand-e2e.log"
          set +e
          "$RUNNER_TEMP/ordenowa-browser-venv/bin/python" \
            tests/e2e/verify_brand_admin_browser.py \
            2>&1 | tee "$log_file"
          browser_status=${PIPESTATUS[0]}
          set -e
          if [ "$browser_status" -ne 0 ]; then
            failure_line=$(rg '^FAIL:' "$log_file" | tail -n 1 || true)
            diagnostics_line=$(rg '^ORDENOWA_BRAND_SETTINGS_DIAGNOSTICS=' "$log_file" | tail -n 1 || true)
            stale_target_line=$(rg '^ORDENOWA_PUBLISH_STALE_TARGET=' "$log_file" | tail -n 1 || true)
            printf 'ORDENOWA brand browser failure: %s\n' "${failure_line:-See the uploaded brand browser log for the failing stage.}" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$diagnostics_line" ]; then
              printf '%s\n' "$diagnostics_line" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -n "$stale_target_line" ]; then
              printf '%s\n' "$stale_target_line" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$browser_status"
          fi

      - name: Verify customer registration, email login, logout, password reset, and my page in Chromium
        id: account_browser_qa
        continue-on-error: true
        shell: bash
        env:
          SHOP_BASE_URL: http://localhost:18080
          MAILPIT_API_URL: http://127.0.0.1:8025
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/ordenowa-browser-qa/customer-account-e2e.log"
          set +e
          "$RUNNER_TEMP/ordenowa-browser-venv/bin/python" \
            tests/e2e/verify_customer_account_browser.py \
            2>&1 | tee "$log_file"
          browser_status=${PIPESTATUS[0]}
          set -e
          if [ "$browser_status" -ne 0 ]; then
            failure_line=$(rg '^FAIL:' "$log_file" | tail -n 1 || true)
            diagnostics_lines=$(rg '^ORDENOWA_ACCOUNT_REGISTRATION_SAFE_STATE=' "$log_file" || true)
            profile_diagnostics_lines=$(rg '^ORDENOWA_ACCOUNT_PROFILE_UPDATE_SAFE_STATE=' "$log_file" || true)
            printf 'ORDENOWA customer account browser failure: %s\n' "${failure_line:-See the uploaded account browser log for the failing stage.}" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$diagnostics_lines" ]; then
              while IFS= read -r diagnostics_line; do
                printf '%s\n' "$diagnostics_line" >> "$GITHUB_STEP_SUMMARY"
                diagnostics_annotation=${diagnostics_line//'%'/'%25'}
                diagnostics_annotation=${diagnostics_annotation//$'\r'/'%0D'}
                diagnostics_annotation=${diagnostics_annotation//$'\n'/'%0A'}
                printf '::error title=Customer account registration safe state::%s\n' "$diagnostics_annotation"
              done <<< "$diagnostics_lines"
            fi
            if [ -n "$profile_diagnostics_lines" ]; then
              while IFS= read -r profile_diagnostics_line; do
                printf '%s\n' "$profile_diagnostics_line" >> "$GITHUB_STEP_SUMMARY"
                profile_diagnostics_annotation=${profile_diagnostics_line//'%'/'%25'}
                profile_diagnostics_annotation=${profile_diagnostics_annotation//$'\r'/'%0D'}
                profile_diagnostics_annotation=${profile_diagnostics_annotation//$'\n'/'%0A'}
                printf '::error title=Customer account profile update safe state::%s\n' "$profile_diagnostics_annotation"
              done <<< "$profile_diagnostics_lines"
            fi
            exit "$browser_status"
          fi

      - name: Verify Korean admin native product create and edit in Chromium
        id: product_admin_browser_qa
        continue-on-error: true
        shell: bash
        env:
          SHOP_BASE_URL: http://localhost:18080
          ADMIN_LOGIN_URL: http://localhost:18080/admin-kuranea
          ADMIN_MAIL: ci-kuranea@example.invalid
          ADMIN_PASSWD: Ci-Only-Admin-Password-92!
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/ordenowa-browser-qa/product-admin-e2e.log"
          set +e
          "$RUNNER_TEMP/ordenowa-browser-venv/bin/python" \
            tests/e2e/verify_product_admin_browser.py \
            2>&1 | tee "$log_file"
          browser_status=${PIPESTATUS[0]}
          set -e
          if [ "$browser_status" -ne 0 ]; then
            failure_line=$(rg '^ORDENOWA_PRODUCT_ADMIN_STAGE=' "$log_file" | tail -n 1 || true)
            printf 'ORDENOWA product admin browser failure: %s\n' "${failure_line:-See the uploaded product admin browser log for the failing stage.}" >> "$GITHUB_STEP_SUMMARY"
            exit "$browser_status"
          fi

      - name: Verify real product detail and cart in Chromium (no payment)
        id: storefront_browser_qa
        continue-on-error: true
        shell: bash
        env:
          SHOP_BASE_URL: http://127.0.0.1:18080
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
        run: |
          set -euo pipefail
          product_id=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T mariadb \
            sh -ec 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb --protocol=tcp -h127.0.0.1 -uroot -N "$MARIADB_DATABASE" -e "SELECT id_product FROM ps_product WHERE reference LIKE \"KURANEA-CI-%\" AND active=1 ORDER BY id_product DESC LIMIT 1"')
          if ! [[ "$product_id" =~ ^[0-9]+$ ]] || [ "$product_id" -lt 1 ]; then
            echo "::error title=ORDENOWA browser QA::No isolated active test product found."
            exit 1
          fi
          CI_TEST_PRODUCT_ID="$product_id" \
            "$RUNNER_TEMP/ordenowa-browser-venv/bin/python" \
            tests/e2e/verify_storefront_browser.py \
            2>&1 | tee "$RUNNER_TEMP/ordenowa-browser-qa/storefront-product-cart-e2e.log"

      - name: Enable run-scoped checkout only for the isolated order browser QA
        id: checkout_override
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" \
            -f compose.yaml -f tests/fixtures/ci-checkout.compose.yaml config --quiet
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" \
            -f compose.yaml -f tests/fixtures/ci-checkout.compose.yaml \
            up -d --no-deps --wait --wait-timeout 300 prestashop

      - name: Verify browser customer search, Japan checkout, and unpaid offline order
        id: checkout_customer_browser_qa
        if: steps.checkout_override.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SHOP_BASE_URL: http://localhost:18080
          ADMIN_LOGIN_URL: http://127.0.0.1:18080/admin-kuranea
          ADMIN_MAIL: ci-kuranea@example.invalid
          ADMIN_PASSWD: Ci-Only-Admin-Password-92!
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          product_id=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T mariadb \
            sh -ec 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb --protocol=tcp -h127.0.0.1 -uroot -N "$MARIADB_DATABASE" -e "SELECT id_product FROM ps_product WHERE reference LIKE \"KURANEA-CI-%\" AND active=1 ORDER BY id_product DESC LIMIT 1"')
          if ! [[ "$product_id" =~ ^[0-9]+$ ]] || [ "$product_id" -lt 1 ]; then
            echo "::error title=ORDENOWA checkout QA::No isolated active test product found."
            exit 1
          fi
          CI_TEST_PRODUCT_ID="$product_id" \
            "$RUNNER_TEMP/ordenowa-browser-venv/bin/python" \
            tests/e2e/verify_ci_checkout_admin_browser.py customer \
            2>&1 | tee "$RUNNER_TEMP/ordenowa-browser-qa/ci-checkout-customer-e2e.log"

      - name: Diagnose Japanese order rewrite in the isolated database
        if: always() && steps.checkout_override.outcome == 'success' && steps.checkout_customer_browser_qa.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          printf 'Checkout route settings (hex encoded values):\n'
          route_settings_hex=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T mariadb \
            sh -ec 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb --protocol=tcp -h127.0.0.1 -uroot -N "$MARIADB_DATABASE" -e "SELECT name, HEX(\`value\`) FROM ps_configuration WHERE name IN ('\''PS_REWRITING_SETTINGS'\'', '\''PS_CANONICAL_REDIRECT'\'', '\''PS_LANG_DEFAULT'\'', '\''PS_DEFAULT_LANGUAGE_URL_PREFIX'\'') ORDER BY name"'
          )
          printf 'Japanese order rewrite (hex encoded value):\n'
          japanese_order_rewrite_hex=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T mariadb \
            sh -ec 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb --protocol=tcp -h127.0.0.1 -uroot -N "$MARIADB_DATABASE" -e "SELECT ml.id_shop, ml.id_lang, HEX(ml.url_rewrite) FROM ps_meta_lang ml JOIN ps_meta m ON m.id_meta = ml.id_meta JOIN ps_lang l ON l.id_lang = ml.id_lang WHERE m.page = '\''order'\'' AND l.iso_code = '\''ja'\'' ORDER BY ml.id_shop, ml.id_lang LIMIT 5"'
          )
          route_settings_hex=${route_settings_hex//$'\n'/;}
          japanese_order_rewrite_hex=${japanese_order_rewrite_hex//$'\n'/;}
          printf '::notice title=ORDENOWA checkout rewrite database::route_settings_hex=%s; japanese_order_rewrite_hex=%s\n' \
            "$route_settings_hex" "$japanese_order_rewrite_hex"

      - name: Verify saved browser orders are unpaid and retain Japan addresses
        id: checkout_order_persistence
        if: steps.checkout_customer_browser_qa.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_ci_browser_checkout_order.php' \
            < tests/postcode/verify_ci_browser_checkout_order.php
          for viewport in desktop mobile; do
            order_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["order_id"])' \
              "$RUNNER_TEMP/ordenowa-browser-qa/ci-checkout-$viewport.json")
            product_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["product_id"])' \
              "$RUNNER_TEMP/ordenowa-browser-qa/ci-checkout-$viewport.json")
            if ! [[ "$order_id" =~ ^[0-9]+$ ]] || [ "$order_id" -lt 1 ] \
              || ! [[ "$product_id" =~ ^[0-9]+$ ]] || [ "$product_id" -lt 1 ]; then
              echo "Browser checkout artifact for $viewport has an invalid order or product ID." >&2
              exit 1
            fi
            verified_json="$RUNNER_TEMP/ordenowa-browser-qa/ci-checkout-$viewport-verified.json"
            verification_log="$RUNNER_TEMP/ordenowa-browser-qa/ci-checkout-$viewport-verification.log"
            if ! docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
              -e CI=true \
              -e GITHUB_ACTIONS=true \
              -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
              -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              -e KURANEA_ISOLATED_CI=1 \
              -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
              -e KURANEA_CI_VIEWPORT="$viewport" \
              -e KURANEA_CI_ORDER_ID="$order_id" \
              -e KURANEA_CI_PRODUCT_ID="$product_id" \
              prestashop runuser -g www-data -u www-data -- \
              php /tmp/verify_ci_browser_checkout_order.php \
              > "$verified_json" 2> "$verification_log"; then
              cat "$verification_log" >&2
              exit 1
            fi
            cat "$verification_log"
          done

      - name: Verify a separate admin session can view both browser orders
        id: checkout_admin_browser_qa
        if: steps.checkout_customer_browser_qa.outcome == 'success' && steps.checkout_order_persistence.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SHOP_BASE_URL: http://127.0.0.1:18080
          ADMIN_LOGIN_URL: http://127.0.0.1:18080/admin-kuranea
          ADMIN_MAIL: ci-kuranea@example.invalid
          ADMIN_PASSWD: Ci-Only-Admin-Password-92!
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          product_id=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T mariadb \
            sh -ec 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb --protocol=tcp -h127.0.0.1 -uroot -N "$MARIADB_DATABASE" -e "SELECT id_product FROM ps_product WHERE reference LIKE \"KURANEA-CI-%\" AND active=1 ORDER BY id_product DESC LIMIT 1"')
          CI_TEST_PRODUCT_ID="$product_id" \
            "$RUNNER_TEMP/ordenowa-browser-venv/bin/python" \
            tests/e2e/verify_ci_checkout_admin_browser.py admin \
            2>&1 | tee "$RUNNER_TEMP/ordenowa-browser-qa/ci-checkout-admin-e2e.log"

      - name: Restore the fail-closed base checkout environment
        id: checkout_restore
        if: always() && steps.checkout_override.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" \
            up -d --no-deps --force-recreate --wait --wait-timeout 300 prestashop

      - name: Recheck storefront checkout stays gated after unpaid CI order QA
        id: checkout_gate_after_order
        if: always() && (steps.checkout_override.outcome == 'success' || steps.checkout_override.outcome == 'failure') && steps.checkout_restore.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SHOP_BASE_URL: http://127.0.0.1:18080
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
        run: |
          set -euo pipefail
          product_id=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T mariadb \
            sh -ec 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb --protocol=tcp -h127.0.0.1 -uroot -N "$MARIADB_DATABASE" -e "SELECT id_product FROM ps_product WHERE reference LIKE \"KURANEA-CI-%\" AND active=1 ORDER BY id_product DESC LIMIT 1"')
          CI_TEST_PRODUCT_ID="$product_id" \
            "$RUNNER_TEMP/ordenowa-browser-venv/bin/python" \
            tests/e2e/verify_storefront_browser.py \
            2>&1 | tee "$RUNNER_TEMP/ordenowa-browser-qa/storefront-checkout-gate-after-ci-order.log"

      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordenowa-storefront-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ordenowa-browser-qa/
          if-no-files-found: error
          retention-days: 30

      - name: Verify browser QA screenshot coverage
        if: always()
        shell: bash
        env:
          BRAND_BROWSER_QA_OUTCOME: ${{ steps.brand_browser_qa.outcome }}
          ACCOUNT_BROWSER_QA_OUTCOME: ${{ steps.account_browser_qa.outcome }}
          PRODUCT_ADMIN_BROWSER_QA_OUTCOME: ${{ steps.product_admin_browser_qa.outcome }}
          STOREFRONT_BROWSER_QA_OUTCOME: ${{ steps.storefront_browser_qa.outcome }}
          CHECKOUT_OVERRIDE_OUTCOME: ${{ steps.checkout_override.outcome }}
          CHECKOUT_CUSTOMER_BROWSER_QA_OUTCOME: ${{ steps.checkout_customer_browser_qa.outcome }}
          CHECKOUT_ORDER_PERSISTENCE_OUTCOME: ${{ steps.checkout_order_persistence.outcome }}
          CHECKOUT_ADMIN_BROWSER_QA_OUTCOME: ${{ steps.checkout_admin_browser_qa.outcome }}
          CHECKOUT_RESTORE_OUTCOME: ${{ steps.checkout_restore.outcome }}
          CHECKOUT_GATE_AFTER_ORDER_OUTCOME: ${{ steps.checkout_gate_after_order.outcome }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ordenowa-browser-qa"
          if [[ "$BRAND_BROWSER_QA_OUTCOME" == success \
            && "$ACCOUNT_BROWSER_QA_OUTCOME" == success \
            && "$PRODUCT_ADMIN_BROWSER_QA_OUTCOME" == success \
            && "$STOREFRONT_BROWSER_QA_OUTCOME" == success \
            && "$CHECKOUT_OVERRIDE_OUTCOME" == success \
            && "$CHECKOUT_CUSTOMER_BROWSER_QA_OUTCOME" == success \
            && "$CHECKOUT_ORDER_PERSISTENCE_OUTCOME" == success \
            && "$CHECKOUT_ADMIN_BROWSER_QA_OUTCOME" == success \
            && "$CHECKOUT_RESTORE_OUTCOME" == success \
            && "$CHECKOUT_GATE_AFTER_ORDER_OUTCOME" == success ]]; then
            required_artifacts=(
              ordenowa-brand-e2e.log
              customer-account-e2e.log
              product-admin-e2e.log
              storefront-product-cart-e2e.log
              ci-checkout-customer-e2e.log
              ci-checkout-admin-e2e.log
              storefront-checkout-gate-after-ci-order.log
              brand-desktop-published.png
              brand-mobile-published.png
              desktop-customer-account-created.png
              mobile-customer-account-created.png
              product-admin-created-desktop.png
              product-admin-mobile.png
              desktop-home.png
              mobile-home.png
              checkout-desktop.png
              checkout-mobile.png
            )
            missing_artifacts=()
            for artifact in "${required_artifacts[@]}"; do
              if [ ! -s "$artifact_dir/$artifact" ]; then
                missing_artifacts+=("$artifact")
              fi
            done
            if ((${#missing_artifacts[@]})); then
              printf '::error title=Browser QA artifact coverage::Missing required logs or PC/mobile screenshots: %s\n' \
                "${missing_artifacts[*]}"
              exit 1
            fi
            printf 'PASS: browser QA logs and PC/mobile screenshots are ready for artifact upload.\n'
          else
            if [ ! -d "$artifact_dir" ] || [ -z "$(find "$artifact_dir" -maxdepth 1 -type f -print -quit)" ]; then
              echo '::error title=Browser QA artifact coverage::No browser QA log or screenshot was produced.'
              exit 1
            fi
            printf 'Browser QA did not complete; uploading available logs and captures for diagnosis.\n'
          fi

      - name: Verify the fresh shop and restart persistence
        id: fresh_install_restart
        if: steps.checkout_restore.outcome == 'success'
        continue-on-error: true
        env:
          SHOP_BASE_URL: http://127.0.0.1:18080
        run: bash tests/smoke/fresh_install.sh "$CI_COMPOSE_PROJECT_NAME"

      - name: Download and import official Japan Post KEN_ALL data
        id: postal_import
        if: steps.checkout_restore.outcome == 'success'
        continue-on-error: true
        run: bash tests/smoke/run_postal_updater.sh "$CI_COMPOSE_PROJECT_NAME"

      - name: Verify official Japan Post import contains national address data
        id: postal_verify
        if: steps.postal_import.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          actual=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T mariadb \
            sh -ec 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb --protocol=tcp -h127.0.0.1 -uroot -N "$MARIADB_DATABASE" -e "SELECT COUNT(*) FROM ps_kuraneapostcode_address"')
          if ! [[ "$actual" =~ ^[0-9]+$ ]] || [ "$actual" -lt 100000 ]; then
            echo "::error title=Japan Post address coverage::Official import did not contain the expected national postcode dataset."
            exit 1
          fi
          printf 'PASS: official Japan Post KEN_ALL dataset imported; count=%s\n' "$actual"

      - name: Aggregate browser QA and postal verification failures
        if: always()
        env:
          BRAND_BROWSER_QA_OUTCOME: ${{ steps.brand_browser_qa.outcome }}
          ACCOUNT_BROWSER_QA_OUTCOME: ${{ steps.account_browser_qa.outcome }}
          PRODUCT_ADMIN_BROWSER_QA_OUTCOME: ${{ steps.product_admin_browser_qa.outcome }}
          STOREFRONT_BROWSER_QA_OUTCOME: ${{ steps.storefront_browser_qa.outcome }}
          CHECKOUT_OVERRIDE_OUTCOME: ${{ steps.checkout_override.outcome }}
          CHECKOUT_CUSTOMER_BROWSER_QA_OUTCOME: ${{ steps.checkout_customer_browser_qa.outcome }}
          CHECKOUT_ORDER_PERSISTENCE_OUTCOME: ${{ steps.checkout_order_persistence.outcome }}
          CHECKOUT_ADMIN_BROWSER_QA_OUTCOME: ${{ steps.checkout_admin_browser_qa.outcome }}
          CHECKOUT_RESTORE_OUTCOME: ${{ steps.checkout_restore.outcome }}
          CHECKOUT_GATE_AFTER_ORDER_OUTCOME: ${{ steps.checkout_gate_after_order.outcome }}
          FRESH_INSTALL_RESTART_OUTCOME: ${{ steps.fresh_install_restart.outcome }}
          POSTAL_IMPORT_OUTCOME: ${{ steps.postal_import.outcome }}
          POSTAL_VERIFY_OUTCOME: ${{ steps.postal_verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          failed_steps=()
          for entry in \
            "brand=$BRAND_BROWSER_QA_OUTCOME" \
            "account=$ACCOUNT_BROWSER_QA_OUTCOME" \
            "product_admin=$PRODUCT_ADMIN_BROWSER_QA_OUTCOME" \
            "storefront=$STOREFRONT_BROWSER_QA_OUTCOME" \
            "checkout_override=$CHECKOUT_OVERRIDE_OUTCOME" \
            "checkout_customer=$CHECKOUT_CUSTOMER_BROWSER_QA_OUTCOME" \
            "checkout_order_persistence=$CHECKOUT_ORDER_PERSISTENCE_OUTCOME" \
            "checkout_admin=$CHECKOUT_ADMIN_BROWSER_QA_OUTCOME" \
            "checkout_restore=$CHECKOUT_RESTORE_OUTCOME" \
            "checkout_gate_after_order=$CHECKOUT_GATE_AFTER_ORDER_OUTCOME" \
            "fresh_install_restart=$FRESH_INSTALL_RESTART_OUTCOME" \
            "postal_import=$POSTAL_IMPORT_OUTCOME" \
            "postal_verify=$POSTAL_VERIFY_OUTCOME"; do
            if [[ "$entry" != *=success ]]; then
              failed_steps+=("$entry")
            fi
          done
          if ((${#failed_steps[@]})); then
            printf '::error title=ORDENOWA isolated QA::Failed steps: %s\n' "${failed_steps[*]}"
            exit 1
          fi
          printf 'PASS: isolated browser QA and official postcode verification completed.\n'

      - name: Capture bounded diagnostics on failure
        if: failure()
        shell: bash
        run: |
          {
            printf 'Build outcome: %s\n' '${{ steps.image_build.outcome }}'
            printf 'Cache probe outcome: %s\n' '${{ steps.cache_probe.outcome }}'
            printf 'Compose startup outcome: %s\n' '${{ steps.compose_up.outcome }}'
          } | tee "$RUNNER_TEMP/kuranea-bootstrap-stage.txt" >> "$GITHUB_STEP_SUMMARY"
          bash tests/smoke/collect_failure_diagnostics.sh

      - name: Upload redacted install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuranea-compose-startup-diagnostics-redacted.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Remove only this run's containers and volumes
        if: always()
        run: |
          docker rm -f "${CI_COMPOSE_PROJECT_NAME}-mailpit" >/dev/null 2>&1 || true
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" down -v --remove-orphans
