          browser_status=${PIPESTATUS[0]}
          set -e
          if [ "$browser_status" -ne 0 ]; then
            python3 - "$log_file" "$GITHUB_STEP_SUMMARY" <<'PYDIAGNOSTIC' || true
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          # _emit_failure emits bounded stage/exception and safe route enums.
          failure = next((line for line in reversed(lines) if line.startswith("FAIL: free shipping browser QA at ")),
                         "Carrier configure failed; see the uploaded browser log.")[:1200]
          with Path(sys.argv[2]).open("a", encoding="utf-8") as summary:
              summary.write("ORDENOWA carrier configure browser failure: " + failure + "\n")
          annotation = failure.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=ORDENOWA carrier configure browser QA::" + annotation)
          PYDIAGNOSTIC
            exit "$browser_status"
          fi

