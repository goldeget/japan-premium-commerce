        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get \
            -o Dir::Cache::archives="$RUNNER_TEMP/ordenowa-cjk-apt-cache/archives" \
            -o APT::Keep-Downloaded-Packages=true \
            install -y fonts-noto-cjk
          sudo fc-cache -f
          jp_family="$(fc-match -f '%{family[0]}' 'Noto Sans CJK JP')"
          kr_family="$(fc-match -f '%{family[0]}' 'Noto Sans CJK KR')"
          if [[ "$jp_family" != "Noto Sans CJK JP" || "$kr_family" != "Noto Sans CJK KR" ]]; then
            printf '::error title=ORDENOWA Chromium fonts::Noto CJK JP/KR font resolution failed (JP=%s, KR=%s).\n' \
              "$jp_family" "$kr_family"
            exit 1
          fi
          printf 'PASS: fontconfig resolves Japanese and Korean Noto CJK fonts.\n'
          python3 -m venv "$RUNNER_TEMP/ordenowa-browser-venv"
          "$RUNNER_TEMP/ordenowa-browser-venv/bin/pip" install --disable-pip-version-check --quiet selenium==4.27.1
          command -v google-chrome || command -v chromium
          mkdir -p "$RUNNER_TEMP/ordenowa-browser-qa"

