          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/ordenowa-push-contracts/tests/pwa/php/outbox_repository.php' < tests/pwa/php/outbox_repository.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/ordenowa-push-contracts/tests/pwa/php/outbox_database.php' < tests/pwa/php/outbox_database.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/ordenowa-push-contracts/tests/pwa/php/order_history_producer.php' < tests/pwa/php/order_history_producer.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
