            "admin_recovery=$ADMIN_RECOVERY_BROWSER_OUTCOME" \
            "order_lifecycle=$ORDER_LIFECYCLE_OUTCOME" \
            "backup_restore_drill=$BACKUP_RESTORE_DRILL_OUTCOME" \
            "fresh_install_restart=$FRESH_INSTALL_RESTART_OUTCOME" \
            "postal_import=$POSTAL_IMPORT_OUTCOME" \
            "postal_verify=$POSTAL_VERIFY_OUTCOME"; do
            if [[ "$entry" != *=success ]]; then
              failed_steps+=("$entry")
            fi
          done
          if [[ "$SHIPPING_FREE_ADMIN_BROWSER_QA_OUTCOME" == success \
            && "$SHIPPING_FREE_TRACKING_PERSISTENCE_OUTCOME" != success ]]; then
            failed_steps+=("shipping_free_tracking_persistence=$SHIPPING_FREE_TRACKING_PERSISTENCE_OUTCOME")
          fi
          if [[ "$SECURITY_ADMIN_LOCALE_MUTATED" == 1 && "$SECURITY_LOCALE_RESTORE_OUTCOME" != success ]]; then
            failed_steps+=("security_locale_restore=$SECURITY_LOCALE_RESTORE_OUTCOME")
          fi
          if ((${#failed_steps[@]})); then
            printf '::error title=ORDENOWA isolated QA::Failed steps: %s\n' "${failed_steps[*]}"
            exit 1
          fi
          printf 'PASS: isolated browser QA and official postcode verification completed.\n'

      - name: Capture bounded diagnostics on failure
        if: failure()
        shell: bash
        run: |
          {
            printf 'Build outcome: %s\n' '${{ steps.image_build.outcome }}'
            printf 'Cache probe outcome: %s\n' '${{ steps.cache_probe.outcome }}'
            printf 'Compose startup outcome: %s\n' '${{ steps.compose_up.outcome }}'
          } | tee "$RUNNER_TEMP/kuranea-bootstrap-stage.txt" >> "$GITHUB_STEP_SUMMARY"
          bash tests/smoke/collect_failure_diagnostics.sh

      - name: Upload redacted install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuranea-compose-startup-diagnostics-redacted.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Remove only this run's containers and volumes
        if: always()
        env:
          RESTORE_PROJECT_OWNED: ${{ steps.backup_restore_drill.outputs.restore_project_owned }}
          MAILPIT_OWNED: ${{ steps.mailpit_setup.outputs.mailpit_owned }}
        run: |
          cleanup_failed=0
          if [[ "$RESTORE_PROJECT_OWNED" == true ]]; then
            restore_project="${CI_COMPOSE_PROJECT_NAME}-restore"
            expected_restore_project="kuranea-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-restore"
            if [[ "$restore_project" != "$expected_restore_project" ]]; then
              echo '::error title=ORDENOWA restore cleanup::Restore project identity did not match this run.'
              cleanup_failed=1
            elif ! docker compose -p "$restore_project" down -v --remove-orphans; then
              echo '::error title=ORDENOWA restore cleanup::The exact run-scoped restore project could not be removed.'
              cleanup_failed=1
            fi
          fi
          if [[ "$MAILPIT_OWNED" == true ]]; then
            expected_mailpit_name="kuranea-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-mailpit"
            if [[ "${CI_COMPOSE_PROJECT_NAME}-mailpit" != "$expected_mailpit_name" ]]; then
              echo '::error title=ORDENOW Mailpit cleanup::Mailpit container identity did not match this run.'
              cleanup_failed=1
            elif ! mailpit_identity=$(docker ps -a --filter "name=^/${expected_mailpit_name}$" --format '{{.ID}}|{{.Names}}'); then
              echo '::error title=ORDENOW Mailpit cleanup::Docker could not inspect the owned Mailpit container.'
              cleanup_failed=1
            elif [[ -n "$mailpit_identity" ]]; then
              if [[ "$mailpit_identity" == *$'\n'* ]] \
                || ! [[ "$mailpit_identity" =~ ^([a-f0-9]{12,64})\|([A-Za-z0-9_.-]+)$ ]] \
                || [[ "${BASH_REMATCH[2]:-}" != "$expected_mailpit_name" ]]; then
                echo '::error title=ORDENOW Mailpit cleanup::Docker returned an ambiguous Mailpit container identity.'
                cleanup_failed=1
              elif ! docker rm -f "${BASH_REMATCH[1]}" >/dev/null; then
                echo '::error title=ORDENOW Mailpit cleanup::The owned Mailpit container could not be removed.'
                cleanup_failed=1
              fi
            fi
          fi
          if ! docker compose -p "$CI_COMPOSE_PROJECT_NAME" down -v --remove-orphans; then
            echo '::error title=ORDENOWA CI cleanup::The exact main run-scoped project could not be removed.'
            cleanup_failed=1
          fi
          exit "$cleanup_failed"
