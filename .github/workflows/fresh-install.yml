          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            bash -o pipefail -ec 'find /tmp/ordenowa-push-contracts/tests/pwa/php -type f -name "*.php" -print0 | xargs -0 -n 1 php -l'
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            php /tmp/ordenowa-push-contracts/tests/pwa/php/run.php
          push_override_attempted=0
          restore_push_defaults() {
            push_status=$?
            trap - EXIT
            if [[ "$push_override_attempted" == 1 ]]; then
              if ! docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
                php /tmp/ordenowa-push-consent.php restore; then
                echo '::error title=ORDENOWA synthetic push QA::Could not restore blank synthetic consent configuration.'
                push_status=1
              fi
              if ! docker compose -p "$CI_COMPOSE_PROJECT_NAME" \
                up -d --no-deps --force-recreate --wait --wait-timeout 300 prestashop; then
                echo '::error title=ORDENOWA synthetic push QA::Could not restore the base environment.'
                push_status=1
              fi
            fi
            exit "$push_status"
