      - name: Resolve Chromium font package cache key
        id: cjk_font_package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          candidate="$(apt-cache policy fonts-noto-cjk | awk '$1 == "Candidate:" { print $2; exit }')"
          if [[ -z "$candidate" || "$candidate" == "(none)" ]]; then
            echo '::error title=ORDENOWA Chromium fonts::fonts-noto-cjk has no apt candidate.'
            exit 1
          fi
          . /etc/os-release
          platform="${ID}-${VERSION_ID}-$(dpkg --print-architecture)"
          version_hash="$(printf '%s' "$candidate" | sha256sum | cut -c1-16)"
          printf 'platform=%s\nversion_hash=%s\n' "$platform" "$version_hash" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/ordenowa-cjk-apt-cache/archives/partial"

      - name: Restore Chromium font package archives
        id: cjk_font_archive_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ordenowa-cjk-apt-cache/archives/*.deb
          key: ordenowa-cjk-${{ steps.cjk_font_package.outputs.platform }}-${{ steps.cjk_font_package.outputs.version_hash }}

      - name: Prepare Chromium browser smoke environment
