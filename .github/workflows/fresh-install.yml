          }
          allowed_page_classes = {
              'unknown', 'outside_admin', 'same_origin_non_admin', 'admin_login',
              'admin_return_list', 'admin_return_edit', 'prestashop_security_compromised',
              'security_path_without_marker', 'security_marker_off_path', 'other_admin',
          }
          allowed_compromised_classifications = {
              'none', 'prestashop_security_compromised',
              'security_path_without_marker', 'security_marker_off_path',
          }
