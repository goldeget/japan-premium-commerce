              -e KURANEA_CI_ORDER_ID="$order_id" \
              -e KURANEA_CI_PRODUCT_ID="$product_id" \
              -e KURANEA_CI_CARRIER_ID="$carrier_id" \
              -e KURANEA_CI_BROWSER_ORDER_PATH=/tmp/ci-shipping-free-order.json \
              prestashop runuser -g www-data -u www-data -- \
              php /tmp/verify_ci_free_shipping_order.php \
              > "$verified_json" 2> "$verification_log"; then
              cat "$verification_log" >&2
              exit 1
            fi
            cat "$verification_log"
          done

      - name: Verify free-shipping orders in a separate admin browser session
        id: shipping_free_admin_browser_qa
        if: steps.shipping_free_order_persistence.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SHOP_BASE_URL: http://localhost:18080
