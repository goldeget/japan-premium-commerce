            access_line=''
          fi
          if [[ -z "$access_line" && "$readback_status" -eq 0 ]]; then
            readback_status=2
          fi
          if [[ "$access_line" != *'"authorization_ready":true'* ]]; then
            readback_status=2
          fi
          if [[ -n "$access_line" ]]; then
            printf '%s\n' "$access_line" >> "$GITHUB_STEP_SUMMARY"
          else
            access_line='ORDENOWA_CATALOG_ADMIN_ACCESS={"readback_available":false,"authorization_ready":false,"failure_stage":"unknown","exception_class":"Exception"}'
            printf '%s\n' "$access_line" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$readback_status" -ne 0 ]]; then
            printf '::error title=ORDENOWA catalog admin access readback::%s\n' "${access_line:-ORDENOWA_CATALOG_ADMIN_ACCESS readback unavailable}"
            exit "$readback_status"
          fi

      - name: Verify synthetic catalog import review and native draft in Chromium
        id: catalog_import_browser_qa
        if: always() && !cancelled() && steps.catalog_import_fixture.outcome == 'success' && env.ORDENOWA_ADMIN_QA_FOCUS != 'true'
        continue-on-error: true
        shell: bash
        env:
          SHOP_BASE_URL: http://localhost:18080
          ADMIN_LOGIN_URL: http://localhost:18080/admin-kuranea
          ADMIN_MAIL: ci-ordenowa@example.invalid
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
        run: |
          set -euo pipefail
          log_file="$QA_ARTIFACT_DIR/catalog-import-e2e.log"
          set +e
          "$RUNNER_TEMP/ordenowa-browser-venv/bin/python" tests/e2e/verify_catalog_import_browser.py \
            2>&1 | tee "$log_file"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          browser_status="${pipeline_status[0]:-1}"
          tee_status="${pipeline_status[1]:-1}"
          if [[ "$browser_status" -ne 0 ]]; then
            diagnostic_file="$QA_ARTIFACT_DIR/catalog-import-failure-diagnostics.json"
            diagnostic_line='ORDENOWA_CATALOG_IMPORT_SAFE_DIAGNOSTICS={"diagnostics":"unavailable"}'
            if [[ -s "$diagnostic_file" ]]; then
              if diagnostic_json=$(python3 tests/e2e/catalog_import_diagnostics.py --json "$diagnostic_file"); then
                diagnostic_line="ORDENOWA_CATALOG_IMPORT_SAFE_DIAGNOSTICS=$diagnostic_json"
              fi
            fi
            printf 'ORDENOWA catalog import browser QA failed: %s\n' "$diagnostic_line" >> "$GITHUB_STEP_SUMMARY"
            annotation=${diagnostic_line//'%'/'%25'}
            annotation=${annotation//$'\r'/'%0D'}
            annotation=${annotation//$'\n'/'%0A'}
            printf '::error title=ORDENOWA catalog import browser QA::%s\n' "$annotation"
            exit "$browser_status"
          fi
          if [[ "$tee_status" -ne 0 ]]; then
            printf 'ORDENOWA catalog import browser QA log capture failed; browser_status=0, tee_status=%s\n' "$tee_status" >> "$GITHUB_STEP_SUMMARY"
            exit "$tee_status"
          fi
          product_id=$(python3 -c 'import json,os; from pathlib import Path; print(int(json.loads((Path(os.environ["QA_ARTIFACT_DIR"])/"catalog-import-readback.json").read_text())["linked_product_id"]))')
          [[ "$product_id" =~ ^[1-9][0-9]*$ ]]
          # Read-only native persistence evidence, independent of the manager's status copy.
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T -e IMPORT_PRODUCT_ID="$product_id" prestashop \
            php -r '
          require "/var/www/html/config/config.inc.php";
          $id = (int) getenv("IMPORT_PRODUCT_ID");
          if ($id < 1) { exit(1); }
          $db = Db::getInstance();
          $p = $db->getRow("SELECT active, visibility, available_for_order FROM " . _DB_PREFIX_ . "product WHERE id_product=" . $id);
          $s = $db->getRow("SELECT active, visibility, available_for_order FROM " . _DB_PREFIX_ . "product_shop WHERE id_shop=1 AND id_product=" . $id);
          $images = (int) $db->getValue("SELECT COUNT(*) FROM " . _DB_PREFIX_ . "image WHERE id_product=" . $id);
          $combinations = (int) $db->getValue("SELECT COUNT(*) FROM " . _DB_PREFIX_ . "product_attribute WHERE id_product=" . $id);
          $stockRows = $db->executeS("SELECT sa.quantity FROM " . _DB_PREFIX_ . "product_attribute pa INNER JOIN " . _DB_PREFIX_ . "stock_available sa ON sa.id_product=pa.id_product AND sa.id_product_attribute=pa.id_product_attribute WHERE pa.id_product=" . $id . " AND sa.id_shop=1 ORDER BY pa.id_product_attribute");
          $combinationQuantities = array_map(static fn(array $row): int => (int) $row["quantity"], is_array($stockRows) ? $stockRows : []);
          $baseQuantity = (int) $db->getValue("SELECT quantity FROM " . _DB_PREFIX_ . "stock_available WHERE id_product=" . $id . " AND id_product_attribute=0 AND id_shop=1");
          $sameReference = (int) $db->getValue("SELECT COUNT(*) FROM " . _DB_PREFIX_ . "product WHERE reference=(SELECT reference FROM (SELECT reference FROM " . _DB_PREFIX_ . "product WHERE id_product=" . $id . ") AS imported)");
          foreach ([$p, $s] as $row) {
              if (!$row || (int) $row["active"] !== 0 || $row["visibility"] !== "none" || (int) $row["available_for_order"] !== 0) { exit(1); }
          }
          if ($images !== 1 || $combinations !== 2 || $combinationQuantities !== [5, 5] || $baseQuantity !== 0 || $sameReference !== 1) { exit(1); }
          echo json_encode(["linked_product_id" => $id, "active" => false, "visibility" => "none", "available_for_order" => false, "images" => $images, "combinations" => $combinations, "base_quantity" => $baseQuantity, "combination_quantities" => $combinationQuantities, "same_reference_product_count" => $sameReference]), PHP_EOL;
          ' | tee "$QA_ARTIFACT_DIR/catalog-import-persistence.json"

