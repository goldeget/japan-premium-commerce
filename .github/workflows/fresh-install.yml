              raise SystemExit("seed output did not contain a versioned published ORDENOWA logo path")
          print(f"{email}\t{logo_path}")
          PY
          ); then
            printf 'FAIL: disposable customer or published logo seed result did not match the CI contract.\n' >> "$log_file"
            exit 1
          fi
          IFS=$'\t' read -r customer_email published_email_logo_path <<< "$seed_values"
