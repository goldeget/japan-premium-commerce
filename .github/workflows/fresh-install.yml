              echo "Free-shipping $viewport browser artifact has invalid native order identifiers." >&2
              exit 1
            fi
            docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
              sh -c 'cat > /tmp/ci-shipping-free-order.json' < "$browser_order"
            verified_json="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-$viewport-verified.json"
            verification_log="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-$viewport-verification.log"
            if ! docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
              -e CI=true \
              -e GITHUB_ACTIONS=true \
              -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
              -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              -e KURANEA_ISOLATED_CI=1 \
