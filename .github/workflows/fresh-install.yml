          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/prepare_ci_carrier_admin_access.php' \
            < tests/postcode/prepare_ci_carrier_admin_access.php \
            2> "$fixture_log" || copy_status=$?
          if ((copy_status != 0)); then
            echo "::error title=ORDENOWA isolated carrier access fixture::stage=stage_fixture_copy; exit_code=$copy_status"
            exit "$copy_status"
          fi
          fixture_status=0
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true \
