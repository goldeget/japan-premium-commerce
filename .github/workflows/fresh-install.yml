      - name: Restore CI administrator language after locale QA
        id: security_locale_restore
        if: always() && !cancelled() && env.KURANEA_SECURITY_ADMIN_LOCALE_MUTATED == '1'
        continue-on-error: true
        shell: bash
        env:
          ADMIN_MAIL: ci-ordenowa@example.invalid
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/restore_ci_admin_locale.php' \
            < tests/business_profile/restore_ci_admin_locale.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e KURANEA_ISOLATED_CI=1 \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e ADMIN_MAIL="$ADMIN_MAIL" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/restore_ci_admin_locale.php

      - name: Verify the fresh shop and restart persistence
