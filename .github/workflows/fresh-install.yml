              browser_order="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-order.json"
            elif [ "$viewport" = osaka ]; then
              browser_order="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-mobile-order.json"
            else
              browser_order="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-taxable-order.json"
              expected_product_id="$CI_TEST_TAX_PRODUCT_ID"
            fi
            order_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["order_id"])' "$browser_order")
            product_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["product_id"])' "$browser_order")
            carrier_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["carrier_id"])' "$browser_order")
            product_tax_group_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["product_tax_rule_group_id"])' "$browser_order")
            if ! [[ "$order_id" =~ ^[0-9]+$ ]] || [ "$order_id" -lt 1 ] \
              || [ "$product_id" != "$expected_product_id" ] \
              || [ "$product_tax_group_id" != "$expected_tax_group_id" ] \
              || ! [[ "$carrier_id" =~ ^[0-9]+$ ]] || [ "$carrier_id" -lt 1 ]; then
              echo "Free-shipping $viewport browser artifact has invalid native order identifiers." >&2
              exit 1
            fi
            docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
              sh -c 'cat > /tmp/ci-shipping-free-order.json' < "$browser_order"
            verified_json="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-$viewport-verified.json"
            verification_log="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-$viewport-verification.log"
            if ! docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
              -e CI=true \
              -e GITHUB_ACTIONS=true \
              -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
              -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              -e KURANEA_ISOLATED_CI=1 \
              -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
              -e KURANEA_CI_ORDER_ID="$order_id" \
              -e KURANEA_CI_PRODUCT_ID="$product_id" \
              -e KURANEA_CI_CARRIER_ID="$carrier_id" \
              -e KURANEA_CI_TAX_RULES_GROUP_ID="$CI_TEST_TAX_RULES_GROUP_ID" \
              -e KURANEA_CI_BROWSER_ORDER_PATH=/tmp/ci-shipping-free-order.json \
              prestashop runuser -g www-data -u www-data -- \
              php /tmp/verify_ci_free_shipping_order.php \
              > "$verified_json" 2> "$verification_log"; then
              cat "$verification_log" >&2
              if [ -s "$verified_json" ]; then
                cat "$verified_json"
              else
                echo "::error title=ORDENOWA native order verifier::No structured PHP diagnostic was produced."
              fi
              exit 1
            fi
            cat "$verification_log"
          done
          exemption_order="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-exemption-order.json"
          exemption_order_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["order_id"])' "$exemption_order")
          exemption_product_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["product_id"])' "$exemption_order")
          exemption_carrier_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["carrier_id"])' "$exemption_order")
          exemption_group_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["product_tax_rule_group_id"])' "$exemption_order")
          if ! [[ "$exemption_order_id" =~ ^[0-9]+$ ]] || [ "$exemption_order_id" -lt 1 ] \
            || [ "$exemption_product_id" != "$CI_TEST_EXEMPT_PRODUCT_ID" ] \
            || [ "$exemption_group_id" != "$CI_TEST_EXEMPT_TAX_RULES_GROUP_ID" ] \
            || ! [[ "$exemption_carrier_id" =~ ^[0-9]+$ ]] || [ "$exemption_carrier_id" -lt 1 ]; then
            echo 'Explicit exemption browser artifact has invalid or mismatched run-scoped product/order identifiers.' >&2
            exit 1
          fi
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_ci_free_shipping_exemption_order.php' \
            < tests/postcode/verify_ci_free_shipping_exemption_order.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/ci-shipping-free-exemption-order.json' < "$exemption_order"
          exemption_verified_json="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-exemption-verified.json"
          exemption_verification_log="$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-exemption-verification.log"
          if ! docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e KURANEA_CI_ORDER_ID="$exemption_order_id" \
            -e KURANEA_CI_PRODUCT_ID="$exemption_product_id" \
            -e KURANEA_CI_CARRIER_ID="$exemption_carrier_id" \
            -e KURANEA_CI_TAX_RULES_GROUP_ID="$CI_TEST_EXEMPT_TAX_RULES_GROUP_ID" \
            -e KURANEA_CI_BROWSER_ORDER_PATH=/tmp/ci-shipping-free-exemption-order.json \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/verify_ci_free_shipping_exemption_order.php \
            > "$exemption_verified_json" 2> "$exemption_verification_log"; then
            cat "$exemption_verification_log" >&2
            if [ -s "$exemption_verified_json" ]; then
              cat "$exemption_verified_json"
            else
              echo '::error title=ORDENOWA exemption order verifier::No structured PHP diagnostic was produced.'
            fi
            exit 1
          fi
          cat "$exemption_verification_log"

      - name: Verify free-shipping orders in a separate admin browser session
        id: shipping_free_admin_browser_qa
        if: steps.shipping_free_order_persistence.outcome == 'success' && env.ORDENOWA_ADMIN_SECURITY_FOCUS != 'true'
        continue-on-error: true
        shell: bash
        env:
          SHOP_BASE_URL: http://localhost:18080
          ADMIN_LOGIN_URL: http://localhost:18080/admin-kuranea
          ADMIN_MAIL: ci-ordenowa@example.invalid
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ordenowa-browser-venv/bin/python" \
            tests/e2e/verify_ci_free_shipping_browser.py admin \
            2>&1 | tee "$RUNNER_TEMP/ordenowa-browser-qa/shipping-free-admin-order-e2e.log"

      - name: Restore the fail-closed base checkout environment
        id: checkout_restore
        if: always() && steps.checkout_override.outcome != 'skipped' && env.ORDENOWA_ADMIN_SECURITY_FOCUS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" \
            up -d --no-deps --force-recreate --wait --wait-timeout 300 prestashop

      - name: Recheck storefront checkout stays gated after unpaid CI order QA
        id: checkout_gate_after_order
        if: always() && (steps.checkout_override.outcome == 'success' || steps.checkout_override.outcome == 'failure') && steps.checkout_restore.outcome == 'success' && env.ORDENOWA_ADMIN_SECURITY_FOCUS != 'true'
        continue-on-error: true
        shell: bash
        env:
          SHOP_BASE_URL: http://127.0.0.1:18080
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
        run: |
          set -euo pipefail
          product_id=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T mariadb \
            sh -ec 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb --protocol=tcp -h127.0.0.1 -uroot -N "$MARIADB_DATABASE" -e "SELECT id_product FROM ps_product WHERE reference LIKE \"KURANEA-CI-%\" AND active=1 ORDER BY id_product DESC LIMIT 1"')
          CI_TEST_PRODUCT_ID="$product_id" \
            "$RUNNER_TEMP/ordenowa-browser-venv/bin/python" \
            tests/e2e/verify_storefront_browser.py \
            2>&1 | tee "$RUNNER_TEMP/ordenowa-browser-qa/storefront-checkout-gate-after-ci-order.log"

      - name: Prepare CI-only paid-like order for return verification
        id: order_lifecycle_fixture
        if: steps.checkout_order_persistence.outcome == 'success' && steps.checkout_gate_after_order.outcome == 'success' && env.ORDENOWA_ADMIN_SECURITY_FOCUS != 'true'
        continue-on-error: true
        shell: bash
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          desktop_order_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["order_id"])' \
            "$QA_ARTIFACT_DIR/ci-checkout-desktop.json")
          mobile_order_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["order_id"])' \
            "$QA_ARTIFACT_DIR/ci-checkout-mobile.json")
          if ! [[ "$desktop_order_id" =~ ^[0-9]+$ ]] || [ "$desktop_order_id" -lt 1 ] \
            || ! [[ "$mobile_order_id" =~ ^[0-9]+$ ]] || [ "$mobile_order_id" -lt 1 ] \
            || [ "$desktop_order_id" -eq "$mobile_order_id" ]; then
            echo '::error title=ORDENOWA native order lifecycle fixture::Browser order IDs were invalid or not distinct.'
            exit 1
          fi
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/prepare_ci_native_order_lifecycle.php' \
            < tests/postcode/prepare_ci_native_order_lifecycle.php
          fixture_stdout="$RUNNER_TEMP/order-lifecycle-fixture.stdout"
          if ! docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e KURANEA_CI_PAID_LIKE_SOURCE_ORDER_ID="$mobile_order_id" \
            -e KURANEA_CI_UNPAID_ORDER_ID="$desktop_order_id" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/prepare_ci_native_order_lifecycle.php \
            > "$fixture_stdout" 2> "$RUNNER_TEMP/order-lifecycle-fixture.stderr"; then
            cat "$RUNNER_TEMP/order-lifecycle-fixture.stderr" >&2
            exit 1
          fi
          fixture_payload=$(sed -n '1p' "$fixture_stdout")
          paid_like_order_id=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("status")=="prepared" and d.get("synthetic CI-only") is True and d.get("provider_call") is False; print(d["paid_like_order_id"])' "$fixture_payload")
          if ! [[ "$paid_like_order_id" =~ ^[0-9]+$ ]] || [ "$paid_like_order_id" -lt 1 ]; then
            echo '::error title=ORDENOWA native order lifecycle fixture::The synthetic paid-like fixture returned an invalid order ID.'
            exit 1
          fi
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(json.dumps({"status":d["status"],"paid_like_order_id":int(d["paid_like_order_id"]),"synthetic_ci_only":d["synthetic CI-only"],"provider_call":d["provider_call"],"cash_refund":d["cash_refund"]},sort_keys=True))' \
            "$fixture_payload" > "$QA_ARTIFACT_DIR/order-lifecycle-preparation.json"
          printf 'paid_like_order_id=%s\n' "$paid_like_order_id" >> "$GITHUB_OUTPUT"
          printf 'unpaid_order_id=%s\n' "$desktop_order_id" >> "$GITHUB_OUTPUT"
          printf 'PASS: the mobile fixture is marked synthetic CI-only; no payment provider or funds were used.\n' \
            | tee "$QA_ARTIFACT_DIR/order-lifecycle-e2e.log"
          rm -f -- "$fixture_stdout" "$RUNNER_TEMP/order-lifecycle-fixture.stderr"

      - name: Submit customer return request in Chromium
        id: order_return_browser
        if: steps.order_lifecycle_fixture.outcome == 'success' && steps.mailpit_setup.outcome == 'success' && env.ORDENOWA_ADMIN_SECURITY_FOCUS != 'true'
        continue-on-error: true
        shell: bash
        env:
          CI: 'true'
          KURANEA_ISOLATED_CI: '1'
          KURANEA_CI_PROJECT_NAME: ${{ env.CI_COMPOSE_PROJECT_NAME }}
          SHOP_BASE_URL: http://localhost:18080
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PAID_LIKE_ORDER_ID: ${{ steps.order_lifecycle_fixture.outputs.paid_like_order_id }}
        run: |
          set -euo pipefail
          mkdir -p "$QA_ARTIFACT_DIR"
          "$RUNNER_TEMP/ordenowa-browser-venv/bin/python" \
            tests/e2e/verify_ci_native_customer_return_browser.py \
            2>&1 | tee "$QA_ARTIFACT_DIR/customer-return-e2e.log"

      - name: Verify native admin return state form in Chromium
        id: order_return_admin_browser
        if: steps.order_return_browser.outcome == 'success' && steps.mailpit_setup.outcome == 'success' && env.ORDENOWA_ADMIN_SECURITY_FOCUS != 'true'
        continue-on-error: true
        shell: bash
        env:
          CI: 'true'
          KURANEA_ISOLATED_CI: '1'
          KURANEA_CI_PROJECT_NAME: ${{ env.CI_COMPOSE_PROJECT_NAME }}
          SHOP_BASE_URL: http://localhost:18080
          ADMIN_LOGIN_URL: http://localhost:18080/admin-kuranea
          ADMIN_MAIL: ci-ordenowa@example.invalid
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PAID_LIKE_ORDER_ID: ${{ steps.order_lifecycle_fixture.outputs.paid_like_order_id }}
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
        run: |
          set -euo pipefail
          mkdir -p "$QA_ARTIFACT_DIR"
          "$RUNNER_TEMP/ordenowa-browser-venv/bin/python" \
            tests/e2e/verify_ci_admin_return_browser.py \
            2>&1 | tee "$QA_ARTIFACT_DIR/admin-return-e2e.log"

      - name: Verify native order cancellation, return, and credit-slip behavior
        id: order_lifecycle
        if: always() && !cancelled() && steps.order_lifecycle_fixture.outcome == 'success' && env.ORDENOWA_ADMIN_SECURITY_FOCUS != 'true'
        continue-on-error: true
        shell: bash
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          UNPAID_ORDER_ID: ${{ steps.order_lifecycle_fixture.outputs.unpaid_order_id }}
          PAID_LIKE_ORDER_ID: ${{ steps.order_lifecycle_fixture.outputs.paid_like_order_id }}
          KURANEA_CI_RETURN_BROWSER_OUTCOME: ${{ steps.order_return_browser.outcome }}
          KURANEA_CI_ADMIN_RETURN_BROWSER_OUTCOME: ${{ steps.order_return_admin_browser.outcome }}
        run: |
          set -euo pipefail
          if ! [[ "$UNPAID_ORDER_ID" =~ ^[0-9]+$ ]] || [ "$UNPAID_ORDER_ID" -lt 1 ] \
            || ! [[ "$PAID_LIKE_ORDER_ID" =~ ^[0-9]+$ ]] || [ "$PAID_LIKE_ORDER_ID" -lt 1 ]; then
            echo '::error title=ORDENOWA native order lifecycle::Fixture outputs were missing or invalid.'
            exit 1
          fi
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/verify_ci_native_order_lifecycle.php' \
            < tests/postcode/verify_ci_native_order_lifecycle.php
          verification_stdout="$RUNNER_TEMP/order-lifecycle-verification.stdout"
          if ! docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e KURANEA_ISOLATED_CI=1 \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e KURANEA_CI_RETURN_BROWSER_OUTCOME="$KURANEA_CI_RETURN_BROWSER_OUTCOME" \
            -e KURANEA_CI_ADMIN_RETURN_BROWSER_OUTCOME="$KURANEA_CI_ADMIN_RETURN_BROWSER_OUTCOME" \
            -e KURANEA_CI_UNPAID_ORDER_ID="$UNPAID_ORDER_ID" \
            -e KURANEA_CI_PAID_LIKE_ORDER_ID="$PAID_LIKE_ORDER_ID" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/verify_ci_native_order_lifecycle.php \
            > "$verification_stdout" 2> "$RUNNER_TEMP/order-lifecycle-verification.stderr"; then
            cat "$RUNNER_TEMP/order-lifecycle-verification.stderr" >&2
            exit 1
          fi
          verification_payload=$(sed -n '1p' "$verification_stdout")
          if ! python3 -c 'import json,sys; d=json.loads(sys.argv[1]); keys=("status","unpaid_cancellation","return_request","credit_slip","cash_refund","return_config_restored"); print(json.dumps({k:d[k] for k in keys if k in d},sort_keys=True))' \
            "$verification_payload" > "$QA_ARTIFACT_DIR/order-lifecycle-verification.json"; then
            echo '::error title=ORDENOWA native order lifecycle::The verifier result could not be safely summarized.'
            exit 1
          fi
          if ! python3 -c 'import json,sys; d=json.loads(sys.argv[1]); expected={"status":"passed","unpaid_cancellation":"passed","return_request":"passed","credit_slip":"passed","cash_refund":"not_requested","return_config_restored":True}; assert all(d.get(k)==v for k,v in expected.items()), "native order lifecycle did not reach every required success state"' \
            "$verification_payload"; then
            echo '::error title=ORDENOWA native order lifecycle::Native lifecycle results were incomplete; sanitized result follows.'
            cat "$QA_ARTIFACT_DIR/order-lifecycle-verification.json"
            exit 1
          fi
          cat "$verification_stdout" | tail -n +2 >> "$QA_ARTIFACT_DIR/order-lifecycle-e2e.log"
          cat "$QA_ARTIFACT_DIR/order-lifecycle-e2e.log"
          rm -f -- "$verification_stdout" "$RUNNER_TEMP/order-lifecycle-verification.stderr"

      - name: Verify run-scoped CI backup and isolated restore
        id: backup_restore_drill
        if: always() && !cancelled() && steps.checkout_restore.outcome == 'success' && env.ORDENOWA_ADMIN_SECURITY_FOCUS != 'true'
        continue-on-error: true
        shell: bash
        env:
          SHOP_PORT: 18080
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
        run: |
          set -euo pipefail
          mkdir -p "$QA_ARTIFACT_DIR"
          bash tests/smoke/backup_restore_drill.sh \
            2>&1 | tee "$QA_ARTIFACT_DIR/backup-restore-drill.log"

      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordenowa-storefront-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ordenowa-browser-qa/
          if-no-files-found: error
          retention-days: 30

      - name: Verify focused admin security route screenshot
        if: always() && env.ORDENOWA_ADMIN_SECURITY_FOCUS == 'true'
        id: admin_dashboard_route_screenshot
        shell: bash
        run: |
          set -euo pipefail
          screenshot="$RUNNER_TEMP/ordenowa-browser-qa/admin-security-view-only-dashboard-route-state.png"
          if [[ ! -s "$screenshot" ]]; then
            echo '::error title=ORDENOWA dashboard route evidence::The focused dashboard route screenshot is missing or empty.'
            exit 1
          fi
          python3 - "$screenshot" <<'PYSCREEN'
          from pathlib import Path
          import struct, sys
          data = Path(sys.argv[1]).read_bytes()
          if len(data) < 24 or data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('focused dashboard route evidence is not a PNG')
          width, height = struct.unpack('>II', data[16:24])
          if width <= 0 or height <= 0:
              raise SystemExit('focused dashboard route screenshot has invalid dimensions')
          print(f'PASS: focused dashboard route screenshot exists ({width}x{height}).')
          PYSCREEN

      - name: Verify browser QA screenshot coverage
        if: always() && env.ORDENOWA_ADMIN_SECURITY_FOCUS != 'true'
        shell: bash
        env:
          SHIPPING_PRODUCT_FIXTURE_OUTCOME: ${{ steps.shipping_product_fixture.outcome }}
          EXEMPTION_PRODUCT_FIXTURE_OUTCOME: ${{ steps.exemption_product_fixture.outcome }}
          TAX_FIXTURE_OUTCOME: ${{ steps.tax_fixture.outcome }}
          VARIANT_FIXTURE_OUTCOME: ${{ steps.variant_fixture.outcome }}
          CART_CONTROLS_BROWSER_QA_OUTCOME: ${{ steps.cart_controls_browser_qa.outcome }}
          SECURITY_FIXTURE_OUTCOME: ${{ steps.security_fixture.outcome }}
          ADMIN_SECURITY_BROWSER_QA_OUTCOME: ${{ steps.admin_security_browser_qa.outcome }}
          RESET_TOKEN_BROWSER_QA_OUTCOME: ${{ steps.reset_token_browser_qa.outcome }}
          PWA_BROWSER_QA_OUTCOME: ${{ steps.pwa_browser_qa.outcome }}
          SHIPPING_FREE_FIXTURE_OUTCOME: ${{ steps.shipping_free_fixture.outcome }}
          SHIPPING_FREE_ADMIN_ACCESS_OUTCOME: ${{ steps.shipping_free_admin_access.outcome }}
          SHIPPING_FREE_ADMIN_CONFIGURE_OUTCOME: ${{ steps.shipping_free_admin_configure.outcome }}
          SHIPPING_FREE_RESTART_OUTCOME: ${{ steps.shipping_free_restart.outcome }}
          SHIPPING_FREE_ADMIN_READBACK_OUTCOME: ${{ steps.shipping_free_admin_readback.outcome }}
          SHIPPING_FREE_CUSTOMER_BROWSER_QA_OUTCOME: ${{ steps.shipping_free_customer_browser_qa.outcome }}
          SHIPPING_FREE_OSAKA_MOBILE_BROWSER_QA_OUTCOME: ${{ steps.shipping_free_osaka_mobile_browser_qa.outcome }}
          SHIPPING_FREE_TAXABLE_BROWSER_QA_OUTCOME: ${{ steps.shipping_free_taxable_browser_qa.outcome }}
          SHIPPING_FREE_EXEMPTION_BROWSER_QA_OUTCOME: ${{ steps.shipping_free_exemption_browser_qa.outcome }}
          SHIPPING_FREE_ORDER_PERSISTENCE_OUTCOME: ${{ steps.shipping_free_order_persistence.outcome }}
          SHIPPING_FREE_ADMIN_BROWSER_QA_OUTCOME: ${{ steps.shipping_free_admin_browser_qa.outcome }}
          BRAND_BROWSER_QA_OUTCOME: ${{ steps.brand_browser_qa.outcome }}
          SHIPPING_ADMIN_BROWSER_QA_OUTCOME: ${{ steps.shipping_admin_browser_qa.outcome }}
          RESET_EMAIL_BRAND_BROWSER_QA_OUTCOME: ${{ steps.reset_email_brand_browser_qa.outcome }}
          ACCOUNT_BROWSER_QA_OUTCOME: ${{ steps.account_browser_qa.outcome }}
          ACCOUNT_CHECKOUT_OVERRIDE_OUTCOME: ${{ steps.account_checkout_override.outcome }}
          ACCOUNT_CHECKOUT_RESTORE_OUTCOME: ${{ steps.account_checkout_restore.outcome }}
          PRODUCT_ADMIN_BROWSER_QA_OUTCOME: ${{ steps.product_admin_browser_qa.outcome }}
