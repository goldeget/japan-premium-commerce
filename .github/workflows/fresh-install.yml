          NATIVE_ORDER_PERSISTENCE_OUTCOME: ${{ steps.native_order_persistence.outcome }}
          BRAND_BROWSER_QA_OUTCOME: ${{ steps.brand_browser_qa.outcome }}
          SHIPPING_ADMIN_BROWSER_QA_OUTCOME: ${{ steps.shipping_admin_browser_qa.outcome }}
          RESET_EMAIL_BRAND_BROWSER_QA_OUTCOME: ${{ steps.reset_email_brand_browser_qa.outcome }}
          ACCOUNT_BROWSER_QA_OUTCOME: ${{ steps.account_browser_qa.outcome }}
          PRODUCT_ADMIN_BROWSER_QA_OUTCOME: ${{ steps.product_admin_browser_qa.outcome }}
          STOREFRONT_BROWSER_QA_OUTCOME: ${{ steps.storefront_browser_qa.outcome }}
          CHECKOUT_OVERRIDE_OUTCOME: ${{ steps.checkout_override.outcome }}
          CHECKOUT_CUSTOMER_BROWSER_QA_OUTCOME: ${{ steps.checkout_customer_browser_qa.outcome }}
          CHECKOUT_ORDER_PERSISTENCE_OUTCOME: ${{ steps.checkout_order_persistence.outcome }}
          CHECKOUT_ADMIN_BROWSER_QA_OUTCOME: ${{ steps.checkout_admin_browser_qa.outcome }}
