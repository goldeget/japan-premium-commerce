          ADMIN_SECURITY_BROWSER_QA_OUTCOME: ${{ steps.admin_security_browser_qa.outcome }}
          RESET_TOKEN_BROWSER_QA_OUTCOME: ${{ steps.reset_token_browser_qa.outcome }}
          PWA_BROWSER_QA_OUTCOME: ${{ steps.pwa_browser_qa.outcome }}
          SHIPPING_FREE_FIXTURE_OUTCOME: ${{ steps.shipping_free_fixture.outcome }}
          SHIPPING_FREE_ADMIN_CONFIGURE_OUTCOME: ${{ steps.shipping_free_admin_configure.outcome }}
          SHIPPING_FREE_RESTART_OUTCOME: ${{ steps.shipping_free_restart.outcome }}
          SHIPPING_FREE_ADMIN_READBACK_OUTCOME: ${{ steps.shipping_free_admin_readback.outcome }}
          SHIPPING_FREE_CUSTOMER_BROWSER_QA_OUTCOME: ${{ steps.shipping_free_customer_browser_qa.outcome }}
          SHIPPING_FREE_OSAKA_MOBILE_BROWSER_QA_OUTCOME: ${{ steps.shipping_free_osaka_mobile_browser_qa.outcome }}
          SHIPPING_FREE_TAXABLE_BROWSER_QA_OUTCOME: ${{ steps.shipping_free_taxable_browser_qa.outcome }}
          SHIPPING_FREE_ORDER_PERSISTENCE_OUTCOME: ${{ steps.shipping_free_order_persistence.outcome }}
          SHIPPING_FREE_ADMIN_BROWSER_QA_OUTCOME: ${{ steps.shipping_free_admin_browser_qa.outcome }}
