      - name: Restore CI administrator language after locale QA
        id: security_locale_restore
        if: always() && !cancelled() && env.KURANEA_SECURITY_ADMIN_LOCALE_MUTATED == '1'
        continue-on-error: true
        shell: bash
        env:
          ADMIN_MAIL: ci-ordenowa@example.invalid
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/restore_ci_admin_locale.php' \
            < tests/business_profile/restore_ci_admin_locale.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e KURANEA_ISOLATED_CI=1 \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e KURANEA_CI_PROJECT_NAME="$CI_COMPOSE_PROJECT_NAME" \
            -e ADMIN_MAIL="$ADMIN_MAIL" \
            prestashop runuser -g www-data -u www-data -- \
            php /tmp/restore_ci_admin_locale.php

      - name: Verify the fresh shop and restart persistence
        id: fresh_install_restart
        if: always() && !cancelled() && steps.checkout_restore.outcome == 'success' && env.ORDENOWA_ADMIN_QA_FOCUS != 'true'
        continue-on-error: true
        env:
          SHOP_BASE_URL: http://127.0.0.1:18080
        run: bash tests/smoke/fresh_install.sh "$CI_COMPOSE_PROJECT_NAME"

      - name: Download and import official Japan Post KEN_ALL data
        id: postal_import
        if: always() && !cancelled() && steps.checkout_restore.outcome == 'success' && env.ORDENOWA_ADMIN_QA_FOCUS != 'true'
        continue-on-error: true
        run: bash tests/smoke/run_postal_updater.sh "$CI_COMPOSE_PROJECT_NAME"

      - name: Verify official Japan Post import contains national address data
        id: postal_verify
        if: always() && !cancelled() && steps.postal_import.outcome == 'success' && env.ORDENOWA_ADMIN_QA_FOCUS != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          actual=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T mariadb \
            sh -ec 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb --protocol=tcp -h127.0.0.1 -uroot -N "$MARIADB_DATABASE" -e "SELECT COUNT(*) FROM ps_kuraneapostcode_address"')
          if ! [[ "$actual" =~ ^[0-9]+$ ]] || [ "$actual" -lt 100000 ]; then
            echo "::error title=Japan Post address coverage::Official import did not contain the expected national postcode dataset."
            exit 1
          fi
          printf 'PASS: official Japan Post KEN_ALL dataset imported; count=%s\n' "$actual"

