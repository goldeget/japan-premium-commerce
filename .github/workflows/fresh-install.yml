          expected_state_codes = [f"JP-{code:02d}" for code in range(1, 48)]
          assert int(fixture["zone_id"]) > 0
          assert fixture["country_codes"] == ["JP"]
          assert int(fixture["state_count"]) == 47
          assert int(fixture["active_state_count"]) == 47
          assert fixture["state_iso_codes"] == expected_state_codes
          assert fixture["fixture_scope"] == "run-scoped isolated GitHub Actions disposable checkout database"
