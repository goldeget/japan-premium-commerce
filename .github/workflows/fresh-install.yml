          stock_quantity=$(docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T mariadb \
            sh -ec "MYSQL_PWD=\"\$MARIADB_ROOT_PASSWORD\" mariadb --protocol=tcp -h127.0.0.1 -uroot -N \"\$MARIADB_DATABASE\" -e \"SELECT COALESCE(SUM(quantity),0) FROM ps_stock_available WHERE id_product=$product_id AND id_product_attribute=0\"" \
            2>&1 | tee -a "$shipping_fixture_log")
          if ! [[ "$product_id" =~ ^[0-9]+$ ]] || [ "$product_id" -lt 1 ] \
            || ! [[ "$japan_zone_id" =~ ^[0-9]+$ ]] || [ "$japan_zone_id" -lt 1 ] \
