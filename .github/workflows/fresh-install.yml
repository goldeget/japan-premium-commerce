      - name: Verify native order cancellation, return, and credit-slip behavior
        id: order_lifecycle
        if: always() && !cancelled() && steps.order_lifecycle_fixture.outcome == 'success' && env.ORDENOWA_ADMIN_QA_FOCUS != 'true'
        continue-on-error: true
        shell: bash
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/ordenowa-browser-qa
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          UNPAID_ORDER_ID: ${{ steps.order_lifecycle_fixture.outputs.unpaid_order_id }}
          PAID_LIKE_ORDER_ID: ${{ steps.order_lifecycle_fixture.outputs.paid_like_order_id }}
          KURANEA_CI_RETURN_BROWSER_OUTCOME: ${{ steps.order_return_browser.outcome }}
          KURANEA_CI_ADMIN_RETURN_BROWSER_OUTCOME: ${{ steps.order_return_admin_browser.outcome }}
        run: |
