          browser_status=${PIPESTATUS[0]}
          set -e
          if [ "$browser_status" -ne 0 ]; then
            failure_line=$(rg '^FAIL:' "$log_file" | tail -n 1 || true)
            diagnostics_lines=$(rg '^ORDENOWA_ACCOUNT_REGISTRATION_SAFE_STATE=' "$log_file" || true)
