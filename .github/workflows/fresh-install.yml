            mkdir -p /tmp/ordenowa-push-contracts/tests/pwa/php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            ln -s /var/www/html/modules /tmp/ordenowa-push-contracts/modules
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
            sh -c 'cat > /tmp/ordenowa-push-contracts/tests/pwa/php/run.php' < tests/pwa/php/run.php
          docker compose -p "$CI_COMPOSE_PROJECT_NAME" exec -T prestashop \
