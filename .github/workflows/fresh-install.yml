          python3 - "$fixture_log" "$GITHUB_ENV" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import json, re, sys
          from pathlib import Path
          marker = 'ORDENOWA_SECURITY_FIXTURE='
          results = [line[len(marker):] for line in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines() if line.startswith(marker)]
          if len(results) != 1:
              raise SystemExit('security fixture did not return exactly one result')
          fixture = json.loads(results[0])
          run_id, attempt = map(re.escape, sys.argv[3:5])
          values = []
          for key, variable, prefix in (
