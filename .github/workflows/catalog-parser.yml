name: Offline catalog parser

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - '.github/workflows/catalog-parser.yml'
      - '.github/workflows/fresh-install.yml'
      - '.gitmodules'
      - 'modules/kuraneacatalog/**'
      - 'themes/hummingbird'
      - 'themes/hummingbird/**'
      - 'tests/catalog/**'
      - 'tests/smoke/test_fresh_install_workflow_contract.py'

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out work
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up PHP with the DOM extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom
          coverage: none

      - name: Lint parser and test PHP files
        shell: bash
        run: |
          set -euo pipefail
          find modules/kuraneacatalog tests/catalog -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run synthetic offline Amazon Japan and Rakuten parser tests
        shell: bash
        run: |
          set -uo pipefail
          test_log="$RUNNER_TEMP/catalog-parser-tests.log"
          php tests/catalog/run.php >"$test_log" 2>&1
          test_status=$?
          if [ "$test_status" -ne 0 ]; then
            {
              echo '### Catalog parser test failure'
              echo '```text'
              tail -n 80 "$test_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            failure_line=$(tail -n 1 "$test_log" | cut -c1-500)
            failure_line="${failure_line//'%'/'%25'}"
            failure_line="${failure_line//$'\r'/'%0D'}"
            failure_line="${failure_line//$'\n'/'%0A'}"
            echo "::error title=Offline catalog parser tests::$failure_line"
            exit "$test_status"
          fi
          cat "$test_log"

      - name: Validate fresh-install workflow contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest tests.smoke.test_fresh_install_workflow_contract -v
