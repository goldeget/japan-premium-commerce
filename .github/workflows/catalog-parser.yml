name: Offline catalog parser

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - '.github/workflows/catalog-parser.yml'
      - '.github/workflows/fresh-install.yml'
      - '.gitmodules'
      - 'modules/kuraneacatalog/**'
      - 'themes/hummingbird'
      - 'themes/hummingbird/**'
      - 'tests/catalog/**'
      - 'tests/smoke/test_fresh_install_workflow_contract.py'

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out work
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up PHP with the DOM extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom
          coverage: none

      - name: Lint parser and test PHP files
        shell: bash
        run: |
          set -euo pipefail
          find modules/kuraneacatalog tests/catalog -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run synthetic offline Amazon Japan and Rakuten parser tests
        shell: bash
        run: |
          set -uo pipefail
          test_log="$RUNNER_TEMP/catalog-parser-tests.log"
          if php tests/catalog/run.php >"$test_log" 2>&1; then
            test_status=0
          else
            test_status=$?
          fi
          if [ "$test_status" -ne 0 ]; then
            failure_type=$(awk '
              /^PHP Fatal error:/ {
                if ($0 ~ /Uncaught RuntimeException:/) { print "RuntimeException"; exit }
                if ($0 ~ /Uncaught InvalidArgumentException:/) { print "InvalidArgumentException"; exit }
                if ($0 ~ /Uncaught LogicException:/) { print "LogicException"; exit }
                if ($0 ~ /Uncaught DomainException:/) { print "DomainException"; exit }
                if ($0 ~ /Uncaught OutOfBoundsException:/) { print "OutOfBoundsException"; exit }
                if ($0 ~ /Uncaught UnexpectedValueException:/) { print "UnexpectedValueException"; exit }
                if ($0 ~ /Uncaught TypeError:/) { print "TypeError"; exit }
                if ($0 ~ /Uncaught Error:/) { print "Error"; exit }
                if ($0 ~ /Uncaught ParseError:/) { print "ParseError"; exit }
                if ($0 ~ /Uncaught /) { print "PHP_EXCEPTION"; exit }
                print "PHP_FATAL"; exit
              }
            ' "$test_log")
            case "$failure_type" in
              RuntimeException|InvalidArgumentException|LogicException|DomainException|OutOfBoundsException|UnexpectedValueException|TypeError|Error|ParseError|PHP_EXCEPTION|PHP_FATAL) ;;
              *) failure_type='UNKNOWN' ;;
            esac
            failure_site=$(awk '
              /#0 .*\/tests\/catalog\/[A-Za-z0-9_.\/-]+\.php\([0-9]+\)/ {
                source = $0
                sub(/^.*\/tests\/catalog\//, "tests/catalog/", source)
                sub(/\).*/, "", source)
                sub(/\(/, ":", source)
                print source
                exit
              }
            ' "$test_log")
            if [ -z "$failure_site" ]; then
              failure_site='source unavailable'
            fi
            {
              echo '### Catalog parser test failure'
              echo "Failure type: $failure_type"
              echo "Test source: $failure_site"
            } >> "$GITHUB_STEP_SUMMARY"
            failure_line="Offline catalog parser tests failed (type=$failure_type, source=$failure_site)."
            echo "::error title=Offline catalog parser tests::$failure_line"
            exit "$test_status"
          else
            cat "$test_log"
          fi

      - name: Validate fresh-install workflow contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest tests.smoke.test_fresh_install_workflow_contract tests.smoke.test_catalog_parser_workflow_contract -v
