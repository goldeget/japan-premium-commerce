name: Offline release manifest checks

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - 'tools/release/**'
      - 'tests/release/**'
      - '.github/workflows/release-manifest.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify local release identity and file hash contracts
        run: python -m unittest discover -s tests/release -p 'test_release_manifest.py' -v
